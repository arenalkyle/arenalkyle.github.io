<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redraft Rankings &middot; The Board</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg: #1c0f0d;
  --panel: #2a1613;
  --panel-alt: #311a16;
  --panel-hi: #3a1f1a;
  --border: #4a2b22;
  --border-soft: #3a231d;
  --brass: #c9a15a;
  --brass-bright: #e6c384;
  --brass-dim: #8a6a3f;
  --text: #f2e4d4;
  --text-dim: #cbab97;
  --text-mute: #8f7161;

  --tier-s: #e7b33b;
  --tier-a: #d98a3d;
  --tier-b: #c97a52;
  --tier-c: #8fa66b;
  --tier-d: #6b93a6;
  --tier-e: #8b7bb0;
  --tier-f: #a2896a;
  --tier-g: #7a685a;
  --tier-h: #58493f;
}

*{ box-sizing: border-box; }
html, body{ margin:0; padding:0; height:100%; overflow: hidden; }

body{
  background-color: var(--bg);
  background-image:
    repeating-linear-gradient(115deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 3px),
    repeating-linear-gradient(115deg, rgba(255,214,170,0.02) 0px, rgba(255,214,170,0.02) 2px, transparent 2px, transparent 46px),
    radial-gradient(ellipse at 20% -10%, rgba(201,161,90,0.10), transparent 55%),
    radial-gradient(ellipse at 90% 0%, rgba(120,50,35,0.25), transparent 45%);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.wrap{
  max-width: 1240px; margin: 0 auto; padding: 22px 20px 18px;
  height: 100vh; display: flex; flex-direction: column;
}

/* ---------- Header ---------- */
.board-head{
  flex: 0 0 auto;
  display:flex; flex-direction: column; align-items: center; text-align: center;
  gap: 4px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border-soft);
}
.eyebrow{
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--brass); margin: 0; display:flex; align-items:center; gap: 10px;
}
.eyebrow::before{ content:""; width: 16px; height: 1px; background: var(--brass-dim); display:inline-block; }
.board-head h1{
  font-family: 'Fraunces', serif; font-optical-sizing: auto; font-weight: 700;
  font-size: clamp(22px, 3.2vw, 28px); line-height: 1; margin: 0; color: var(--text); letter-spacing: -0.01em;
}
.board-head h1 em{ font-style: italic; font-weight: 500; color: var(--brass-bright); }
.head-meta{ font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-mute); }
.head-meta strong{ color: var(--text-dim); font-weight: 500; }

/* ---------- Controls ---------- */
.search-field{ position: relative; margin-bottom: 12px; flex: 0 0 auto; }
.search-field svg{
  position:absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; stroke: var(--text-mute); pointer-events: none;
}
.search-field input{
  width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 11px 14px 11px 40px; color: var(--text); font-family: 'Inter', sans-serif;
  font-size: 14px; outline: none; transition: border-color .15s ease, background .15s ease;
}
.search-field input::placeholder{ color: var(--text-mute); }
.search-field input:focus{ border-color: var(--brass); background: var(--panel-hi); }
.search-clear{
  position:absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none;
  color: var(--text-mute); font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer;
  padding: 4px 8px; display:none;
}
.search-clear:hover{ color: var(--brass-bright); }

.filters-row{
  flex: 0 0 auto;
  display:flex; align-items:center; gap: 24px; flex-wrap: wrap; margin-bottom: 12px;
}
.filter-group{ display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }
.filter-label{
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-mute);
}
.pill-group{ display:flex; gap: 6px; flex-wrap: wrap; }
.pill{
  background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em;
  padding: 8px 13px; border-radius: 8px; cursor: pointer; transition: all .15s ease;
}
.pill:hover{ border-color: var(--brass-dim); color: var(--text); }
.pill.active{ background: var(--brass); border-color: var(--brass); color: #241209; font-weight: 700; }

/* ---------- Legend ---------- */
.legend{
  flex: 0 0 auto;
  display:flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 14px; padding: 10px 16px;
  background: rgba(0,0,0,0.15); border: 1px solid var(--border-soft); border-radius: 8px;
}
.legend-item{ display:flex; align-items:center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-mute); }
.legend-chip{
  width: 16px; height: 16px; border-radius: 4px; display:flex; align-items:center; justify-content:center;
  font-family: 'Fraunces', serif; font-weight: 700; font-size: 10px; color: rgba(0,0,0,0.65);
}

/* ---------- Table ---------- */
.table-shell{
  border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
}
.table-scroll{ flex: 1 1 auto; min-height: 0; overflow: auto; }
table{ width: 100%; border-collapse: collapse; min-width: 1080px; }

thead th{
  position: sticky; top: 0; z-index: 3; background: #201310; border-bottom: 1px solid var(--border);
  text-align: left; padding: 13px 12px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
  letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-mute); white-space: nowrap;
  cursor: pointer; user-select: none;
}
thead th:hover{ color: var(--brass-bright); }
thead th.sorted{ color: var(--brass-bright); }
thead th .arrow{ font-size: 9px; margin-left: 4px; opacity: 0.8; }
thead th.group-26{ color: #7a6a5a; }
thead th.group-25{ color: var(--text-mute); }
thead th.group-start{ border-left: 1px solid var(--border-soft); }
thead th.no-sort{ cursor: default; }
thead th.no-sort:hover{ color: var(--text-mute); }
.col-pos{ text-align: center; min-width: 46px; }
.pos-pill-cell{
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.03em;
  color: var(--brass); background: rgba(201,161,90,0.12); border: 1px solid var(--border-soft);
  border-radius: 5px; padding: 3px 6px; display:inline-block;
}

th.col-photo, td.col-photo{ position: sticky; left: 0; z-index: 2; width: 48px; min-width: 48px; background: inherit; }
th.col-rank, td.col-rank{ position: sticky; left: 48px; z-index: 2; min-width: 58px; background: inherit; }
th.col-player, td.col-player{ position: sticky; left: 106px; z-index: 2; min-width: 190px; background: inherit; }
th.col-photo, th.col-rank, th.col-player{ background: #201310; }

.col-num{ text-align: right; min-width: 68px; }
.col-num.group-start{ border-left: 1px solid var(--border-soft); }
.col-bye{ text-align: center; min-width: 56px; }

tbody tr{ border-bottom: 1px solid var(--border-soft); transition: background .1s ease; }
tbody tr:nth-child(even){ background: rgba(0,0,0,0.12); }
tbody tr:hover{ background: var(--panel-hi); }
tbody tr.match{ background: rgba(230,195,132,0.10); outline: 1px solid var(--brass-dim); outline-offset: -1px; }

td{ padding: 9px 12px; vertical-align: middle; font-size: 13.5px; }

/* photo avatar */
.avatar-wrap{
  width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: var(--panel-alt);
  border: 1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  position: relative;
}
.avatar-wrap img{ width: 100%; height: 100%; object-fit: cover; object-position: top center; display:block; }
.avatar-wrap.logo img{ object-fit: contain; padding: 4px; background: #17100e; }
.avatar-wrap img.hidden{ display:none; }
.avatar-fallback{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces', serif; font-weight:700; font-size:11px; color: var(--brass-dim);
  background: var(--panel-alt);
}

.rank-cell{ display:flex; align-items:center; gap: 7px; }
.rank-num{ font-family: 'JetBrains Mono', monospace; color: var(--text-mute); font-size: 12px; }
.player-name{ font-family: 'Fraunces', serif; font-weight: 600; font-size: 14.5px; color: var(--text); }
.player-meta{ font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-mute); letter-spacing: 0.03em; margin-top: 2px; }
.pos-tag{ color: var(--brass); }

.num-cell{ font-family: 'JetBrains Mono', monospace; text-align: right; color: var(--text-dim); }
.num-cell.pending{ color: var(--text-mute); opacity: 0.45; font-style: italic; }
.bye-cell{ font-family: 'JetBrains Mono', monospace; text-align: center; color: var(--text-dim); }

.tier-plate{
  display:inline-flex; align-items:center; justify-content:center; width: 22px; height: 22px; border-radius: 5px;
  font-family: 'Fraunces', serif; font-weight: 900; font-size: 12px; color: rgba(0,0,0,0.68);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 3px rgba(0,0,0,0.25); flex-shrink: 0;
}

.empty-state{ padding: 60px 20px; text-align: center; color: var(--text-mute); font-family: 'JetBrains Mono', monospace; font-size: 13px; }

.count-row{
  flex: 0 0 auto;
  margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-mute);
  display:flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}
.count-row span strong{ color: var(--text-dim); }

@media (max-width: 640px){
  .wrap{ padding: 16px 12px 12px; }
  th.col-player, td.col-player{ min-width: 150px; left: 96px; }
}

</style>
</head>

"Matthew Wright","team":"HOU","pos":"K","kyle":null,"wesley":null,"dylyn":null,"marco":null,"shane":null,"ppg25":5.5,"posrank25":0,"ovrank25":0,"ppg26":0,"posrank26":0,"ovrank26":0,"points25":22,"points26":0,"bye":6,"isTeamLogo":false},{"name":"Lucas Havrisik","team":"GB","pos":"K","kyle":null,"wesley":null,"dylyn":null,"marco":null,"shane":null,"ppg25":7.3,"posrank25":0,"ovrank25":0,"ppg26":0,"posrank26":0,"ovrank26":0,"points25":22,"points26":0,"bye":5,"isTeamLogo":false},{"name":"Jude McAtamney","team":"NYG","pos":"K","kyle":null,"wesley":null,"dylyn":null,"marco":null,"shane":null,"ppg25":3.8,"posrank25":0,"ovrank25":0,"ppg26":0,"posrank26":0,"ovrank26":0,"points25":15,"points26":0,"bye":14,"isTeamLogo":false}];

<script>
(function(){
  var RANKERS = [
    { key: 'kyle',   label: 'Kyle'   },
    { key: 'wesley', label: 'Wesley' }
    // { key: 'dylyn',  label: 'Dylyn'  },
  ];

  var TIERS = [
    { key: 'S', max: 3,   color: 'var(--tier-s)' },
    { key: 'A', max: 6,   color: 'var(--tier-a)' },
    { key: 'B', max: 12,  color: 'var(--tier-b)' },
    { key: 'C', max: 22,  color: 'var(--tier-c)' },
    { key: 'D', max: 32,  color: 'var(--tier-d)' },
    { key: 'E', max: 42,  color: 'var(--tier-e)' },
    { key: 'F', max: 52,  color: 'var(--tier-f)' },
    { key: 'G', max: 82,  color: 'var(--tier-g)' },
    { key: 'H', max: Infinity, color: 'var(--tier-h)' }
  ];

  function tierFor(value){
    if (value === null || value === undefined || isNaN(value)) return null;
    for (var i = 0; i < TIERS.length; i++){
      if (value <= TIERS[i].max) return TIERS[i];
    }
    return TIERS[TIERS.length - 1];
  }

  function avgOf(player){
    var vals = [];
    for (var i = 0; i < RANKERS.length; i++){
      var v = player[RANKERS[i].key];
      if (v !== null && v !== undefined) vals.push(v);
    }
    if (vals.length === 0) return null;
    var sum = 0;
    for (var j = 0; j < vals.length; j++) sum += vals[j];
    return sum / vals.length;
  }

  // shared name normalizer -- used both for matching stats data (already baked
  // into the embedded JSON at build time) and for matching ESPN's athlete index
  function normalizeName(str){
    if (!str) return '';
    var s = str.toLowerCase();
    s = s.replace(/[*+]/g, '');
    s = s.replace(/\./g, '');
    s = s.replace(/'/g, '');
    s = s.replace(/\s+/g, ' ').trim();
    s = s.replace(/\s+(jr|sr|ii|iii|iv|v)$/, '');
    return s;
  }

  var players = window.__PLAYERS__.map(function(p){
    p.avg = avgOf(p);
    return p;
  });

  var POS_ORDER = { QB: 0, RB: 1, WR: 2, TE: 3, K: 4, DST: 5 };
  function posRank(pos){
    return POS_ORDER.hasOwnProperty(pos) ? POS_ORDER[pos] : 99;
  }
  function posLabel(pos){
    return pos === 'DST' ? 'D/ST' : pos;
  }

  var state = {
    query: '',
    posAll: true,
    posSet: new Set(),          // populated only when posAll is false
    rankerAll: true,
    rankerSet: new Set(),       // populated only when rankerAll is false
    sortKey: 'rankval',
    sortDir: 'asc'
  };

  var POSITION_KEYS = ['QB', 'RB', 'WR', 'TE', 'K', 'DST'];
  var RANKER_KEYS = RANKERS.map(function(r){ return r.key; });

  var els = {
    search: document.getElementById('search'),
    clear: document.getElementById('searchClear'),
    posPills: document.querySelectorAll('#posPills .pill'),
    rankerPills: document.querySelectorAll('#rankerPills .pill'),
    tbody: document.getElementById('tbody'),
    count: document.getElementById('countRow'),
    headers: document.querySelectorAll('th[data-sort]')
  };

  function normalizeQuery(str){ return (str || '').toLowerCase().trim(); }

  function avgOfKeys(player, keys){
    var vals = [];
    for (var i = 0; i < keys.length; i++){
      var v = player[keys[i]];
      if (v !== null && v !== undefined) vals.push(v);
    }
    if (vals.length === 0) return null;
    var sum = 0;
    for (var j = 0; j < vals.length; j++) sum += vals[j];
    return sum / vals.length;
  }

  // Shared multi-select toggle: "ALL" is exclusive; clicking a specific value
  // while ALL is active narrows to just that value; toggling values in/out
  // otherwise; selecting every individual value (or none) collapses back to ALL.
  function toggleSelection(clicked, allKeys, isAll, currentSet){
    if (clicked === 'ALL') return { all: true, set: new Set() };
    var newSet;
    if (isAll){
      newSet = new Set([clicked]);
    } else {
      newSet = new Set(currentSet);
      if (newSet.has(clicked)) newSet.delete(clicked);
      else newSet.add(clicked);
    }
    if (newSet.size === 0 || newSet.size === allKeys.length){
      return { all: true, set: new Set() };
    }
    return { all: false, set: newSet };
  }

  function rankValueFor(player){
    if (state.rankerAll) return player.avg;
    return avgOfKeys(player, Array.from(state.rankerSet));
  }

  function filtered(){
    var q = normalizeQuery(state.query);
    return players.filter(function(p){
      if (!state.posAll && !state.posSet.has(p.pos)) return false;
      if (!q) return true;
      return normalizeQuery(p.name).indexOf(q) !== -1 || normalizeQuery(p.team).indexOf(q) !== -1;
    });
  }

  function sorted(list){
    var key = state.sortKey;
    var dir = state.sortDir === 'asc' ? 1 : -1;
    return list.slice().sort(function(a, b){
      var av, bv;
      if (key === 'rankval'){ av = rankValueFor(a); bv = rankValueFor(b); }
      else if (key === 'pos'){ av = posRank(a.pos); bv = posRank(b.pos); }
      else { av = a[key]; bv = b[key]; }
      var aNull = (av === null || av === undefined);
      var bNull = (bv === null || bv === undefined);
      if (aNull && bNull) return 0;
      if (aNull) return 1;
      if (bNull) return -1;
      if (av === bv) return 0;
      return av < bv ? -1 * dir : 1 * dir;
    });
  }

  function fmt(v, decimals){
    if (v === null || v === undefined) return null;
    var d = decimals === undefined ? 2 : decimals;
    return (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
  }

  // Points columns: up to 2 decimals, but trim a trailing hundredths-place
  // zero down to 1 decimal (339.30 -> 339.3, 339.33 stays, 202.0 stays 202.0)
  function fmtPoints(v){
    if (v === null || v === undefined) return '\u2014';
    var s = (Math.round(v * 100) / 100).toFixed(2);
    if (s.charAt(s.length - 1) === '0') s = s.slice(0, -1);
    return s;
  }

  // ---------------- ESPN headshot resolution ----------------
  var espn = { index: null, promise: null };
  var ESPN_PAGE_COUNT = 21;

  function loadEspnIndex(){
    if (espn.promise) return espn.promise;
    var urls = [];
    for (var i = 1; i <= ESPN_PAGE_COUNT; i++){
      urls.push('https://sports.core.api.espn.com/v3/sports/football/nfl/athletes?limit=1000&page=' + i);
    }
    espn.promise = Promise.all(urls.map(function(u){
      return fetch(u).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
    })).then(function(pages){
      var index = new Map();
      pages.forEach(function(page){
        if (!page || !page.items) return;
        page.items.forEach(function(item){
          if (!item.fullName || !item.id) return;
          var key = normalizeName(item.fullName);
          if (!key) return;
          var existing = index.get(key);
          // prefer active players when a name collides
          if (!existing || (item.active && !existing._active)) {
            index.set(key, item.id);
            if (item.active) index.set(key + '__active', true);
          }
        });
      });
      espn.index = index;
      return index;
    });
    return espn.promise;
  }
  // kick off in the background so it's likely ready by the time rows scroll into view
  loadEspnIndex();

  function headshotUrlForId(id){
    return 'https://a.espncdn.com/combiner/i?img=/i/headshots/nfl/players/full/' + id + '.png&w=350&h=254';
  }

  function teamLogoUrl(team){
    return 'https://a.espncdn.com/i/teamlogos/nfl/500/' + team.toLowerCase() + '.png';
  }

  function initials(name){
    var parts = name.replace(/[^a-zA-Z' -]/g, '').split(/\s+/).filter(Boolean);
    if (parts.length === 0) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  var photoObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (!entry.isIntersecting) return;
      photoObserver.unobserve(entry.target);
      resolvePhoto(entry.target);
    });
  }, { rootMargin: '250px 0px' }) : null;

  function resolvePhoto(wrapEl){
    var name = wrapEl.getAttribute('data-name');
    loadEspnIndex().then(function(index){
      var id = index.get(normalizeName(name));
      var img = wrapEl.querySelector('img');
      if (!id){
        showFallback(wrapEl);
        return;
      }
      img.onerror = function(){ showFallback(wrapEl); };
      img.onload = function(){ img.classList.remove('hidden'); };
      img.src = headshotUrlForId(id);
    }).catch(function(){ showFallback(wrapEl); });
  }

  function showFallback(wrapEl){
    var img = wrapEl.querySelector('img');
    if (img) img.classList.add('hidden');
    if (!wrapEl.querySelector('.avatar-fallback')){
      var fb = document.createElement('div');
      fb.className = 'avatar-fallback';
      fb.textContent = initials(wrapEl.getAttribute('data-name'));
      wrapEl.appendChild(fb);
    }
  }

  // ---------------- Rendering ----------------
  function renderRow(p, idx, isMatch){
    var tr = document.createElement('tr');
    if (isMatch) tr.className = 'match';

    var rv = rankValueFor(p);
    var tier = tierFor(rv);

    // photo (team logo for D/ST, ESPN headshot for everyone else)
    var tdPhoto = document.createElement('td');
    tdPhoto.className = 'col-photo';
    var wrap = document.createElement('div');
    wrap.className = 'avatar-wrap' + (p.isTeamLogo ? ' logo' : '');
    wrap.setAttribute('data-name', p.name);
    var img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    wrap.appendChild(img);
    tdPhoto.appendChild(wrap);
    tr.appendChild(tdPhoto);
    if (p.isTeamLogo){
      img.onerror = function(){ showFallback(wrap); };
      img.src = teamLogoUrl(p.team);
    } else if (photoObserver) {
      photoObserver.observe(wrap);
    } else {
      resolvePhoto(wrap);
    }

    // rank + tier
    var tdRank = document.createElement('td');
    tdRank.className = 'col-rank';
    var rankCell = document.createElement('div');
    rankCell.className = 'rank-cell';
    var plate = document.createElement('span');
    plate.className = 'tier-plate';
    plate.style.background = tier ? tier.color : 'var(--tier-h)';
    plate.textContent = tier ? tier.key : '-';
    var rn = document.createElement('span');
    rn.className = 'rank-num';
    rn.textContent = rv !== null && rv !== undefined ? fmt(rv, 1) : '\u2014';
    rankCell.appendChild(plate);
    rankCell.appendChild(rn);
    tdRank.appendChild(rankCell);
    tr.appendChild(tdRank);

    // player
    var tdPlayer = document.createElement('td');
    tdPlayer.className = 'col-player';
    var nameEl = document.createElement('div');
    nameEl.className = 'player-name';
    nameEl.textContent = p.name;
    var metaEl = document.createElement('div');
    metaEl.className = 'player-meta';
    metaEl.innerHTML = '<span class="pos-tag">' + p.pos + '</span> \u00b7 ' + p.team;
    tdPlayer.appendChild(nameEl);
    tdPlayer.appendChild(metaEl);
    tr.appendChild(tdPlayer);

    // position
    var tdPos = document.createElement('td');
    tdPos.className = 'col-pos';
    var posSpan = document.createElement('span');
    posSpan.className = 'pos-pill-cell';
    posSpan.textContent = posLabel(p.pos);
    tdPos.appendChild(posSpan);
    tr.appendChild(tdPos);

    // bye (no longer sortable, still shown)
    var tdBye = document.createElement('td');
    tdBye.className = 'bye-cell';
    tdBye.textContent = p.bye ? p.bye : '\u2014';
    tr.appendChild(tdBye);

    // 26' Points / PPG / PosRank / OvRank (always 0 -- pending season)
    var tdPts26 = document.createElement('td');
    tdPts26.className = 'num-cell pending group-start';
    tdPts26.textContent = fmtPoints(p.points26);
    tr.appendChild(tdPts26);

    [['ppg26', 1], ['posrank26', 0], ['ovrank26', 0]].forEach(function(pair){
      var td = document.createElement('td');
      td.className = 'num-cell pending';
      td.textContent = fmt(p[pair[0]], pair[1]);
      tr.appendChild(td);
    });

    // 25' Points / PPG / PosRank / OvRank
    var tdPts25 = document.createElement('td');
    tdPts25.className = 'num-cell group-start';
    tdPts25.textContent = fmtPoints(p.points25);
    tr.appendChild(tdPts25);

    [['ppg25', 1], ['posrank25', 0], ['ovrank25', 0]].forEach(function(pair){
      var td = document.createElement('td');
      td.className = 'num-cell';
      var v = p[pair[0]];
      td.textContent = (v === 0) ? '0' : fmt(v, pair[1]);
      tr.appendChild(td);
    });

    return tr;
  }

  function render(){
    var list = sorted(filtered());
    els.tbody.innerHTML = '';

    if (list.length === 0){
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 13;
      td.className = 'empty-state';
      td.textContent = 'No players match "' + state.query + '".';
      tr.appendChild(td);
      els.tbody.appendChild(tr);
    } else {
      var q = normalizeQuery(state.query);
      var frag = document.createDocumentFragment();
      list.forEach(function(p, idx){
        var isMatch = q && normalizeQuery(p.name).indexOf(q) !== -1;
        frag.appendChild(renderRow(p, idx, isMatch));
      });
      els.tbody.appendChild(frag);
    }

    var rankerLabel = state.rankerAll
      ? 'All (avg)'
      : RANKERS.filter(function(r){ return state.rankerSet.has(r.key); })
          .map(function(r){ return r.label; }).join(' + ');
    var posLabelStr = state.posAll
      ? 'All'
      : POSITION_KEYS.filter(function(k){ return state.posSet.has(k); })
          .map(posLabel).join(' + ');
    els.count.innerHTML = '<span>Showing <strong>' + list.length + '</strong> of <strong>' + players.length + '</strong> players</span>' +
      '<span>Position: <strong>' + posLabelStr + '</strong> &middot; Ranker: <strong>' + rankerLabel + '</strong></span>';

    els.clear.style.display = state.query ? 'block' : 'none';

    els.headers.forEach(function(th){
      th.classList.toggle('sorted', th.getAttribute('data-sort') === state.sortKey);
      var arrow = th.querySelector('.arrow');
      if (arrow) arrow.textContent = th.getAttribute('data-sort') === state.sortKey ? (state.sortDir === 'asc' ? '\u2191' : '\u2193') : '';
    });
  }

  els.search.addEventListener('input', function(e){ state.query = e.target.value; render(); });
  els.clear.addEventListener('click', function(){ state.query = ''; els.search.value = ''; els.search.focus(); render(); });

  els.posPills.forEach(function(pill){
    pill.addEventListener('click', function(){
      var clicked = pill.getAttribute('data-pos');
      var result = toggleSelection(clicked, POSITION_KEYS, state.posAll, state.posSet);
      state.posAll = result.all;
      state.posSet = result.set;
      els.posPills.forEach(function(p){
        var key = p.getAttribute('data-pos');
        var isActive = key === 'ALL' ? state.posAll : (!state.posAll && state.posSet.has(key));
        p.classList.toggle('active', isActive);
      });
      render();
    });
  });

  els.rankerPills.forEach(function(pill){
    pill.addEventListener('click', function(){
      var clicked = pill.getAttribute('data-ranker');
      var result = toggleSelection(clicked, RANKER_KEYS, state.rankerAll, state.rankerSet);
      state.rankerAll = result.all;
      state.rankerSet = result.set;
      els.rankerPills.forEach(function(p){
        var key = p.getAttribute('data-ranker');
        var isActive = key === 'ALL' ? state.rankerAll : (!state.rankerAll && state.rankerSet.has(key));
        p.classList.toggle('active', isActive);
      });
      render();
    });
  });

  els.headers.forEach(function(th){
    th.addEventListener('click', function(){
      var key = th.getAttribute('data-sort');
      if (state.sortKey === key){
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortKey = key;
        state.sortDir = 'asc';
      }
      render();
    });
  });

  render();
})();

</script>
</body>
</html>
