<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscriptions &middot; The Board</title>
<link rel="stylesheet" href="css/theme.css">
<style>
.wrap{
  flex: 1 1 auto; min-height: 0; padding: 18px 24px 32px; max-width: 1100px; width: 100%; margin: 0 auto;
  display: flex; flex-direction: column; overflow-y: auto;
}
.page-head{ margin-bottom: 18px; }
.page-head h1{ font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; margin: 0 0 4px; color: var(--text); }
.page-head p{ font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-mute); margin: 0; }

.plan-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 900px){ .plan-grid{ grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px){ .plan-grid{ grid-template-columns: 1fr; } }

.plan-card{
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
  display:flex; flex-direction:column;
}
.plan-card.current{ border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
.plan-card.featured{ border-color: var(--brass-dim); }
.plan-name{ font-family: 'Fraunces', serif; font-weight: 700; font-size: 17px; color: var(--text); margin: 0 0 2px; }
.plan-price{ font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--brass); margin-bottom: 14px; }
.plan-price .per{ color: var(--text-mute); font-size: 11px; }
.plan-perks{ list-style:none; padding:0; margin: 0 0 18px; flex: 1 1 auto; }
.plan-perks li{
  font-size: 12.5px; color: var(--text-dim); padding: 7px 0 7px 20px; position:relative; line-height: 1.4;
  border-bottom: 1px solid var(--border-soft);
}
.plan-perks li:last-child{ border-bottom:none; }
.plan-perks li::before{ content:"\2713"; position:absolute; left:0; color: var(--brass); font-weight:700; }
.plan-btn{
  background: var(--brass); border: 1px solid var(--brass); color: #241209; font-weight: 700;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 10px; border-radius: 8px; cursor: pointer;
}
.plan-btn:hover{ filter: brightness(1.08); }
.plan-btn:disabled{ opacity: 0.6; cursor: default; }
.plan-btn.current-btn{ background: var(--panel-alt); border-color: var(--border); color: var(--text-mute); }

.plan-status{ text-align:center; font-size: 12px; color: var(--text-mute); margin-top: 16px; min-height: 16px; }
.plan-status.error{ color: var(--danger); }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <div class="topbar"><div id="authBox"></div></div>
    <div class="wrap">

      <div class="page-head">
        <h1>Subscriptions</h1>
        <p>Unlock more leagues and free expert review credits.</p>
      </div>

      <div class="plan-grid" id="planGrid"></div>
      <div class="plan-status" id="planStatus"></div>

    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script>
(function(){
  var PLANS = [
    {
      tier: 'free', name: 'Free', price: '$0', per: '',
      perks: ['Supports 3 leagues', '1 Start/Sit question per month']
    },
    {
      tier: 'premium', name: 'Premium', price: '$7.50', per: '/mo',
      perks: [
        'Supports 10 leagues',
        '1x Start/Sit question per week (Free)',
        '1x Trade Analysis per week (Free)',
        '1x Team Analysis per month (Free)',
        'Access to all posts'
      ]
    },
    {
      tier: 'elite', name: 'Elite', price: '$15', per: '/mo', featured: true,
      perks: [
        'Supports 15 leagues',
        '2x Start/Sit questions per week (Free)',
        '2x Trade Analysis per week (Free)',
        '2x Team Analysis per week (Free)',
        'Access to all posts & commenting'
      ]
    },
    {
      tier: 'legendary', name: 'Legendary', price: '$25', per: '/mo',
      perks: [
        'Supports 25 leagues',
        '4x Start/Sit questions per week (Free)',
        '4x Trade Analysis per week (Free)',
        '3x Team Analysis per week (Free)',
        'Access to all posts & commenting'
      ]
    }
  ];

  var els = {
    grid: document.getElementById('planGrid'),
    status: document.getElementById('planStatus')
  };

  function currentTier(){
    return (window.Auth && window.Auth.profile && window.Auth.profile.subscription_tier) || 'free';
  }

  function render(){
    var mine = currentTier();
    els.grid.innerHTML = '';
    PLANS.forEach(function(plan){
      var isCurrent = plan.tier === mine;
      var card = document.createElement('div');
      card.className = 'plan-card' + (isCurrent ? ' current' : '') + (plan.featured ? ' featured' : '');

      var perksHtml = plan.perks.map(function(p){ return '<li>' + p + '</li>'; }).join('');
      card.innerHTML =
        '<h3 class="plan-name">' + plan.name + '</h3>' +
        '<div class="plan-price">' + plan.price + '<span class="per">' + plan.per + '</span></div>' +
        '<ul class="plan-perks">' + perksHtml + '</ul>';

      var btn = document.createElement('button');
      btn.className = 'plan-btn' + (isCurrent ? ' current-btn' : '');
      if (isCurrent){
        btn.textContent = 'Current Plan';
        btn.disabled = true;
      } else if (!window.Auth || !window.Auth.user){
        btn.textContent = 'Log In to Subscribe';
        btn.addEventListener('click', function(){ window.Auth.openLogin(); });
      } else {
        btn.textContent = plan.tier === 'free' ? 'Downgrade to Free' : 'Choose This Plan';
        btn.addEventListener('click', function(){ choosePlan(plan.tier, btn); });
      }
      card.appendChild(btn);
      els.grid.appendChild(card);
    });
  }

  function choosePlan(tier, btn){
    els.status.textContent = '';
    els.status.classList.remove('error');
    btn.disabled = true;
    btn.textContent = 'Updating…';

    window.sb.rpc('set_my_subscription_tier', { new_tier: tier }).then(function(res){
      if (res.error){
        els.status.textContent = 'Could not update: ' + res.error.message;
        els.status.classList.add('error');
        btn.disabled = false;
        btn.textContent = 'Choose This Plan';
        return;
      }
      // STUB: no Stripe integration yet -- a real subscription would
      // redirect to Stripe Checkout here instead of applying instantly.
      els.status.textContent = 'Payment isn’t wired up yet, so nothing was charged — your plan has been updated.';
      return window.Auth.refreshProfile().then(render);
    });
  }

  render();
  window.addEventListener('auth:change', render);
  if (window.Auth){ window.Auth.ready.then(render); }
})();
</script>
</body>
</html>
