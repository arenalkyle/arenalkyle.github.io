<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create/Edit Rankings &middot; The Board</title>
<link rel="stylesheet" href="css/theme.css">
<style>
html, body{ overflow: hidden; }

.wrap{
  flex: 1 1 auto; min-height: 0; padding: 18px 20px 18px;
  display: flex; flex-direction: column; overflow: hidden;
}

.page-head{ flex: 0 0 auto; margin-bottom: 14px; }
.page-head h1{
  font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; margin: 0 0 4px; color: var(--text);
}
.page-head p{ font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-mute); margin: 0; }

.editor-shell{ position: relative; flex: 1 1 auto; min-height: 0; display:flex; flex-direction: column; }

.search-field{ position: relative; margin-bottom: 10px; flex: 0 0 auto; }
.search-field svg{
  position:absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; stroke: var(--text-mute); pointer-events: none;
}
.search-field input{
  width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 11px 14px 11px 40px; color: var(--text); font-family: 'Inter', sans-serif;
  font-size: 14px; outline: none; transition: border-color .15s ease, background .15s ease;
}
.search-field input::placeholder{ color: var(--text-mute); }
.search-field input:focus{ border-color: var(--brass); background: var(--panel-hi); }
.search-clear{
  position:absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none;
  color: var(--text-mute); font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer;
  padding: 4px 8px; display:none;
}
.search-clear:hover{ color: var(--brass-bright); }

.save-bar{
  flex: 0 0 auto; display:flex; align-items:center; justify-content:space-between; gap: 10px;
  margin-bottom: 10px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
}
.save-bar .hint{ font-size: 12px; color: var(--text-mute); }
.save-btn{
  background: var(--brass); border: 1px solid var(--brass); color: #241209; font-weight: 700;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 16px; border-radius: 7px; cursor: pointer;
}
.save-btn:disabled{ opacity: 0.45; cursor: not-allowed; }
.save-status{ font-size: 12px; color: var(--text-dim); }

/* ---------- Table (mirrors index.html's Rankings table) ---------- */
.table-shell{
  border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
}
.table-scroll{ flex: 1 1 auto; min-height: 0; overflow: auto; }
table{ width: 100%; border-collapse: collapse; min-width: 1150px; }

thead th{
  position: sticky; top: 0; z-index: 3; background: #201310; border-bottom: 1px solid var(--border);
  text-align: left; padding: 13px 12px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
  letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-mute); white-space: nowrap;
}
thead th.group-26{ color: #7a6a5a; }
thead th.group-25{ color: var(--text-mute); }
thead th.group-start{ border-left: 1px solid var(--border-soft); }

.col-pos{ text-align: center; min-width: 46px; }
.pos-pill-cell{
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.03em;
  color: var(--brass); background: rgba(201,161,90,0.12); border: 1px solid var(--border-soft);
  border-radius: 5px; padding: 3px 6px; display:inline-block;
}
.pos-pill-cell.pos-QB{ color: #e0973f; background: rgba(224,151,63,0.14); border-color: rgba(224,151,63,0.35); }
.pos-pill-cell.pos-WR{ color: #e8829c; background: rgba(232,130,156,0.14); border-color: rgba(232,130,156,0.35); }
.pos-pill-cell.pos-RB{ color: #5b9bd5; background: rgba(91,155,213,0.14); border-color: rgba(91,155,213,0.35); }
.pos-pill-cell.pos-TE{ color: #ffffff; background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
.pos-pill-cell.pos-K{ color: #e8d24a; background: rgba(232,210,74,0.14); border-color: rgba(232,210,74,0.35); }
.pos-pill-cell.pos-DST{ color: #e2726a; background: rgba(226,114,106,0.14); border-color: rgba(226,114,106,0.35); }

th.col-select, td.col-select{ position: sticky; left: 0; z-index: 2; width: 54px; min-width: 54px; background: inherit; }
th.col-photo, td.col-photo{ position: sticky; left: 54px; z-index: 2; width: 48px; min-width: 48px; background: inherit; }
th.col-rank, td.col-rank{ position: sticky; left: 102px; z-index: 2; min-width: 96px; background: inherit; }
th.col-player, td.col-player{ position: sticky; left: 198px; z-index: 2; min-width: 190px; background: inherit; }
th.col-select, th.col-photo, th.col-rank, th.col-player{ background: #201310; }

.col-num{ text-align: right; min-width: 68px; }
.col-num.group-start{ border-left: 1px solid var(--border-soft); }
.col-bye{ text-align: center; min-width: 56px; }

tbody tr{ border-bottom: 1px solid var(--border-soft); transition: background .1s ease; cursor: default; }
tbody tr:nth-child(even){ background: rgba(0,0,0,0.12); }
tbody tr:hover{ background: var(--panel-hi); }
tbody tr.selected{ background: rgba(230,195,132,0.12); outline: 1px solid var(--brass-dim); outline-offset: -1px; }
tbody tr.dragging{ opacity: 0.35; }
tbody tr.drag-over-top{ box-shadow: inset 0 2px 0 var(--brass-bright); }
tbody tr.drag-over-bottom{ box-shadow: inset 0 -2px 0 var(--brass-bright); }

td{ padding: 9px 12px; vertical-align: middle; font-size: 13.5px; }

/* photo avatar (shared look with index.html) */
.avatar-wrap{
  width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: var(--panel-alt);
  border: 1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  position: relative;
}
.avatar-wrap img{ width: 100%; height: 100%; object-fit: cover; object-position: top center; display:block; }
.avatar-wrap.logo img{ object-fit: contain; padding: 4px; background: #17100e; }
.avatar-wrap img.hidden{ display:none; }
.avatar-fallback{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces', serif; font-weight:700; font-size:11px; color: var(--brass-dim);
  background: var(--panel-alt);
}

.select-cell{ display:flex; align-items:center; justify-content:center; gap: 8px; }
.select-cell input[type="checkbox"]{ accent-color: var(--brass); width: 15px; height: 15px; cursor:pointer; flex-shrink:0; }
.select-cell .drag-handle{ color: var(--text-mute); font-size: 13px; cursor: grab; flex-shrink:0; }

.rank-cell{ display:flex; align-items:center; gap: 7px; }
.tier-plate{
  display:inline-flex; align-items:center; justify-content:center; width: 22px; height: 22px; border-radius: 5px;
  font-family: 'Fraunces', serif; font-weight: 900; font-size: 12px; color: rgba(0,0,0,0.68);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 3px rgba(0,0,0,0.25); flex-shrink: 0;
}
.rank-num-input{
  width: 40px; flex-shrink:0; background: var(--panel-alt); border: 1px solid var(--border); border-radius: 6px;
  color: var(--brass-bright); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align:center;
  padding: 4px 2px; outline:none;
}
.rank-num-input:focus{ border-color: var(--brass); }

.player-name{ font-family: 'Fraunces', serif; font-weight: 600; font-size: 14.5px; color: var(--text); }
.player-name .player-team{ font-weight: 500; color: var(--text-mute); }

.num-cell{ font-family: 'JetBrains Mono', monospace; text-align: right; color: var(--text-dim); }
.num-cell.pending{ color: var(--text-mute); opacity: 0.45; font-style: italic; }
.bye-cell{ font-family: 'JetBrains Mono', monospace; text-align: center; color: var(--text-dim); }

.gate-overlay{
  position:absolute; inset: 0; z-index: 20; display:none; align-items:center; justify-content:center;
  flex-direction: column; gap: 14px; background: rgba(28,15,13,0.55); border-radius: 10px;
}
.gate-overlay.show{ display:flex; }
.gate-overlay p{ font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-dim); text-align:center; max-width: 280px; }
.editor-shell.locked .table-shell{ filter: blur(6px); pointer-events: none; }
.editor-shell.locked .save-bar{ filter: blur(6px); pointer-events: none; }
.editor-shell.locked .search-field{ filter: blur(6px); pointer-events: none; }

@media (max-width: 640px){
  .wrap{ padding: 16px 12px 12px; }
  th.col-rank, td.col-rank{ min-width: 80px; left: 102px; }
  th.col-player, td.col-player{ min-width: 150px; left: 182px; }
}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <div class="topbar"><div id="authBox"></div></div>
    <div class="wrap">

      <div class="page-head">
        <h1>Create / Edit Rankings</h1>
        <p>Drag players to reorder, or click a rank number and type a new one.</p>
      </div>

      <div class="editor-shell" id="editorShell">
        <div class="gate-overlay" id="gateOverlay">
          <p>Log in to create and edit your own player rankings.</p>
          <button class="login-btn" id="gateLoginBtn">Log In</button>
        </div>

        <div class="search-field">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="editorSearch" type="text" placeholder="Search a player&hellip;" autocomplete="off">
          <button class="search-clear" id="editorSearchClear" type="button">clear</button>
        </div>

        <div class="save-bar">
          <span class="hint" id="selectionHint">Click a row to select it, or drag by its name to move it.</span>
          <span class="save-status" id="saveStatus"></span>
          <button class="save-btn" id="saveBtn" disabled>Save Rankings</button>
        </div>

        <div class="table-shell">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th class="col-select"></th>
                  <th class="col-photo"></th>
                  <th class="col-rank">Rank</th>
                  <th class="col-player">Player</th>
                  <th class="col-pos">PosRk</th>
                  <th class="col-bye">Bye</th>
                  <th class="col-num group-26 group-start">26&rsquo;Pts</th>
                  <th class="col-num group-26">26&rsquo;PPG</th>
                  <th class="col-num group-26">26&rsquo;PosRk</th>
                  <th class="col-num group-26">26&rsquo;OvRk</th>
                  <th class="col-num group-25 group-start">25&rsquo;Pts</th>
                  <th class="col-num group-25">25&rsquo;PPG</th>
                  <th class="col-num group-25">25&rsquo;PosRk</th>
                  <th class="col-num group-25">25&rsquo;OvRk</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/players-data.js"></script>
<script src="js/player-render.js"></script>
<script>
(function(){
  var els = {
    shell: document.getElementById('editorShell'),
    gate: document.getElementById('gateOverlay'),
    gateLoginBtn: document.getElementById('gateLoginBtn'),
    tbody: document.getElementById('tbody'),
    saveBtn: document.getElementById('saveBtn'),
    saveStatus: document.getElementById('saveStatus'),
    selectionHint: document.getElementById('selectionHint'),
    search: document.getElementById('editorSearch'),
    searchClear: document.getElementById('editorSearchClear')
  };
  var searchQuery = '';
  function normalizeQuery(str){ return (str || '').toLowerCase().trim(); }

  els.gateLoginBtn.addEventListener('click', function(){ window.Auth.openLogin(); });
  els.search.addEventListener('input', function(e){
    searchQuery = e.target.value;
    els.searchClear.style.display = searchQuery ? 'block' : 'none';
    renderTable();
  });
  els.searchClear.addEventListener('click', function(){
    searchQuery = '';
    els.search.value = '';
    els.searchClear.style.display = 'none';
    els.search.focus();
    renderTable();
  });

  var playersByKey = {};
  window.__PLAYERS__.forEach(function(p){ playersByKey[window.playerKey(p)] = p; });

  var photoObserver = window.PlayerRender.createPhotoObserver();

  function defaultOrder(){
    // Sensible starting point for a brand-new ranking: current kyle/wesley avg, nulls last, name as tiebreak.
    return window.__PLAYERS__.slice().sort(function(a, b){
      var av = [a.kyle, a.wesley].filter(function(v){ return v !== null && v !== undefined; });
      var bv = [b.kyle, b.wesley].filter(function(v){ return v !== null && v !== undefined; });
      var aAvg = av.length ? av.reduce(function(s, v){ return s + v; }, 0) / av.length : null;
      var bAvg = bv.length ? bv.reduce(function(s, v){ return s + v; }, 0) / bv.length : null;
      if (aAvg === null && bAvg === null) return a.name.localeCompare(b.name);
      if (aAvg === null) return 1;
      if (bAvg === null) return -1;
      return aAvg - bAvg;
    }).map(window.playerKey);
  }

  var order = [];
  var selected = new Set();
  var dirty = false;
  var draggingKeys = null;
  var dragOverKey = null;
  var dragOverPos = null; // 'top' | 'bottom'

  function setDirty(v){
    dirty = v;
    els.saveBtn.disabled = !v;
    els.saveStatus.textContent = v ? 'Unsaved changes' : '';
  }

  function updateSelectionHint(){
    els.selectionHint.textContent = selected.size > 1
      ? selected.size + ' players selected — drag any of them to move the group.'
      : 'Click a row to select it, or drag by its name to move it.';
  }

  function moveBlockToIndex(keys, targetIndex){
    var keySet = new Set(keys);
    var removedBeforeTarget = 0;
    for (var i = 0; i < targetIndex; i++){
      if (keySet.has(order[i])) removedBeforeTarget++;
    }
    var remaining = order.filter(function(k){ return !keySet.has(k); });
    var insertAt = targetIndex - removedBeforeTarget;
    insertAt = Math.max(0, Math.min(insertAt, remaining.length));
    var block = order.filter(function(k){ return keySet.has(k); }); // preserve original relative order
    remaining.splice.apply(remaining, [insertAt, 0].concat(block));
    order = remaining;
  }

  function moveSingleToRank(key, newRank){
    var from = order.indexOf(key);
    if (from === -1) return;
    var to = Math.max(1, Math.min(newRank, order.length)) - 1;
    order.splice(from, 1);
    order.splice(to, 0, key);
  }

  // Position rank (PosRk column), e.g. "RB1" -- computed straight from the
  // current order, since (unlike the Rankings page) there's only one ranking here.
  function computePosRanks(){
    var counts = {};
    var map = new Map();
    order.forEach(function(key){
      var p = playersByKey[key];
      if (!p) return;
      counts[p.pos] = (counts[p.pos] || 0) + 1;
      map.set(key, window.PlayerRender.posLabel(p.pos) + counts[p.pos]);
    });
    return map;
  }

  function renderRow(key, idx, posRankMap){
    var p = playersByKey[key];
    if (!p) return null;
    var rank = idx + 1;
    var tier = window.PlayerRender.tierFor(rank);

    var tr = document.createElement('tr');
    tr.className = selected.has(key) ? 'selected' : '';
    tr.setAttribute('draggable', 'true');
    tr.dataset.key = key;

    // select + drag handle
    var tdSelect = document.createElement('td');
    tdSelect.className = 'col-select';
    var selectCell = document.createElement('div');
    selectCell.className = 'select-cell';
    var checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = selected.has(key);
    checkbox.setAttribute('draggable', 'false');
    checkbox.addEventListener('click', function(e){
      e.stopPropagation();
      if (checkbox.checked) selected.add(key); else selected.delete(key);
      tr.classList.toggle('selected', checkbox.checked);
      updateSelectionHint();
    });
    var handle = document.createElement('span');
    handle.className = 'drag-handle';
    handle.textContent = '≡';
    selectCell.appendChild(checkbox);
    selectCell.appendChild(handle);
    tdSelect.appendChild(selectCell);
    tr.appendChild(tdSelect);

    // photo
    var tdPhoto = document.createElement('td');
    tdPhoto.className = 'col-photo';
    tdPhoto.appendChild(window.PlayerRender.buildAvatarWrap(p, photoObserver));
    tr.appendChild(tdPhoto);

    // rank + tier (editable)
    var tdRank = document.createElement('td');
    tdRank.className = 'col-rank';
    var rankCell = document.createElement('div');
    rankCell.className = 'rank-cell';
    var plate = document.createElement('span');
    plate.className = 'tier-plate';
    plate.style.background = tier ? tier.color : 'var(--tier-h)';
    plate.textContent = tier ? tier.key : '-';
    var rankInput = document.createElement('input');
    rankInput.className = 'rank-num-input';
    rankInput.type = 'number';
    rankInput.min = '1';
    rankInput.max = String(order.length);
    rankInput.value = String(rank);
    rankInput.setAttribute('draggable', 'false');
    rankInput.addEventListener('click', function(e){ e.stopPropagation(); });
    rankInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') rankInput.blur(); });
    rankInput.addEventListener('blur', function(){
      var val = parseInt(rankInput.value, 10);
      if (!isNaN(val) && val !== order.indexOf(key) + 1){
        moveSingleToRank(key, val);
        setDirty(true);
        renderTable();
      } else {
        rankInput.value = String(order.indexOf(key) + 1);
      }
    });
    rankCell.appendChild(plate);
    rankCell.appendChild(rankInput);
    tdRank.appendChild(rankCell);
    tr.appendChild(tdRank);

    // player (name + grayed team, matching the Rankings page)
    var tdPlayer = document.createElement('td');
    tdPlayer.className = 'col-player';
    var nameEl = document.createElement('div');
    nameEl.className = 'player-name';
    nameEl.appendChild(document.createTextNode(p.name + ' '));
    var teamEl = document.createElement('span');
    teamEl.className = 'player-team';
    teamEl.textContent = '· ' + p.team;
    nameEl.appendChild(teamEl);
    tdPlayer.appendChild(nameEl);
    tr.appendChild(tdPlayer);

    // position rank pill, colored by position like the Rankings page
    var tdPos = document.createElement('td');
    tdPos.className = 'col-pos';
    var posSpan = document.createElement('span');
    posSpan.className = 'pos-pill-cell pos-' + p.pos;
    posSpan.textContent = posRankMap.get(key) || '—';
    tdPos.appendChild(posSpan);
    tr.appendChild(tdPos);

    // bye
    var tdBye = document.createElement('td');
    tdBye.className = 'bye-cell';
    tdBye.textContent = p.bye ? p.bye : '—';
    tr.appendChild(tdBye);

    // 26' Points / PPG / PosRank / OvRank (always 0 -- pending season)
    var tdPts26 = document.createElement('td');
    tdPts26.className = 'num-cell pending group-start';
    tdPts26.textContent = window.PlayerRender.fmtPoints(p.points26);
    tr.appendChild(tdPts26);

    [['ppg26', 1], ['posrank26', 0], ['ovrank26', 0]].forEach(function(pair){
      var td = document.createElement('td');
      td.className = 'num-cell pending';
      td.textContent = window.PlayerRender.fmt(p[pair[0]], pair[1]);
      tr.appendChild(td);
    });

    // 25' Points / PPG / PosRank / OvRank
    var tdPts25 = document.createElement('td');
    tdPts25.className = 'num-cell group-start';
    tdPts25.textContent = window.PlayerRender.fmtPoints(p.points25);
    tr.appendChild(tdPts25);

    [['ppg25', 1], ['posrank25', 0], ['ovrank25', 0]].forEach(function(pair){
      var td = document.createElement('td');
      td.className = 'num-cell';
      var v = p[pair[0]];
      td.textContent = (v === 0) ? '0' : window.PlayerRender.fmt(v, pair[1]);
      tr.appendChild(td);
    });

    tr.addEventListener('dragstart', function(e){
      draggingKeys = selected.has(key) && selected.size > 1 ? Array.from(selected) : [key];
      tr.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', key);
    });
    tr.addEventListener('dragend', function(){
      tr.classList.remove('dragging');
      draggingKeys = null;
      clearDragOverStyles();
    });
    tr.addEventListener('dragover', function(e){
      e.preventDefault();
      if (!draggingKeys) return;
      var rect = tr.getBoundingClientRect();
      var pos = (e.clientY - rect.top) < rect.height / 2 ? 'top' : 'bottom';
      clearDragOverStyles();
      tr.classList.add(pos === 'top' ? 'drag-over-top' : 'drag-over-bottom');
      dragOverKey = key;
      dragOverPos = pos;
    });
    tr.addEventListener('drop', function(e){
      e.preventDefault();
      if (!draggingKeys || dragOverKey == null) return;
      var targetIdx = order.indexOf(dragOverKey);
      if (dragOverPos === 'bottom') targetIdx++;
      moveBlockToIndex(draggingKeys, targetIdx);
      setDirty(true);
      clearDragOverStyles();
      renderTable();
    });

    return tr;
  }

  function matchesSearch(key){
    var q = normalizeQuery(searchQuery);
    if (!q) return true;
    var p = playersByKey[key];
    if (!p) return false;
    return normalizeQuery(p.name).indexOf(q) !== -1 || normalizeQuery(p.team).indexOf(q) !== -1;
  }

  function renderTable(){
    var posRankMap = computePosRanks();
    var frag = document.createDocumentFragment();
    var shown = 0;
    order.forEach(function(key, idx){
      if (!matchesSearch(key)) return;
      var tr = renderRow(key, idx, posRankMap);
      if (tr) { frag.appendChild(tr); shown++; }
    });
    els.tbody.innerHTML = '';
    if (shown === 0 && normalizeQuery(searchQuery)){
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 14;
      td.style.textAlign = 'center';
      td.style.color = 'var(--text-mute)';
      td.style.padding = '24px';
      td.textContent = 'No players match "' + searchQuery + '".';
      tr.appendChild(td);
      frag.appendChild(tr);
    }
    els.tbody.appendChild(frag);
  }

  function clearDragOverStyles(){
    els.tbody.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(function(el){
      el.classList.remove('drag-over-top', 'drag-over-bottom');
    });
  }

  function loadMyRankings(){
    if (!window.Auth || !window.Auth.user){
      order = defaultOrder();
      renderTable();
      return;
    }
    window.sb.from('rankings').select('player_key, rank').eq('owner_id', window.Auth.user.id).order('rank').then(function(res){
      if (res.data && res.data.length){
        order = res.data.map(function(r){ return r.player_key; }).filter(function(k){ return playersByKey[k]; });
        var have = new Set(order);
        window.__PLAYERS__.forEach(function(p){ var k = window.playerKey(p); if (!have.has(k)) order.push(k); });
      } else {
        order = defaultOrder();
      }
      selected = new Set();
      setDirty(false);
      renderTable();
      updateSelectionHint();
    });
  }

  els.saveBtn.addEventListener('click', function(){
    els.saveBtn.disabled = true;
    els.saveStatus.textContent = 'Saving…';
    window.sb.rpc('replace_user_rankings', { player_keys: order }).then(function(res){
      if (res.error){
        els.saveStatus.textContent = 'Could not save: ' + res.error.message;
        els.saveBtn.disabled = false;
        return;
      }
      setDirty(false);
      els.saveStatus.textContent = 'Saved.';
    });
  });

  function applyGate(){
    var canEdit = window.Auth && window.Auth.can('create_edit_own_rankings') && window.Auth.user;
    els.shell.classList.toggle('locked', !canEdit);
    els.gate.classList.toggle('show', !canEdit);
  }

  window.addEventListener('auth:change', function(){
    applyGate();
    loadMyRankings();
  });

  order = defaultOrder();
  renderTable();
  if (window.Auth){
    window.Auth.ready.then(function(){
      applyGate();
      loadMyRankings();
    });
  }
})();
</script>
</body>
</html>
