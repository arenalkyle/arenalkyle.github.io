<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Draft &middot; The Board</title>
<link rel="stylesheet" href="css/theme.css">
<style>
.wrap{
  flex: 1 1 auto; min-height: 0; padding: 18px 24px 32px; width: 100%;
  display: flex; flex-direction: column; overflow-y: auto;
}
.page-head{ margin-bottom: 18px; }
.page-head h1{ font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; margin: 0 0 4px; color: var(--text); }
.page-head p{ font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-mute); margin: 0; }

.md-layout{ display:grid; grid-template-columns: 360px 1fr; gap: 20px; align-items:start; }
@media (max-width: 860px){ .md-layout{ grid-template-columns: 1fr; } }

.panel{ background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.panel h2{ font-family: 'Fraunces', serif; font-weight: 700; font-size: 16px; color: var(--text); margin: 0 0 14px; }

.md-row{ display:flex; gap: 10px; }
.md-row .modal-field{ flex: 1 1 0; }

.roster-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 4px; }
.roster-field label{
  display:block; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--text-mute); margin-bottom: 4px;
}
/* Custom stepper -- replaces the native <input type=number> spinner
   arrows (deliberately not used anywhere on this site: hard to click,
   inconsistent across browsers). */
.stepper{
  display:flex; align-items:stretch; background: var(--panel-alt); border: 1px solid var(--border);
  border-radius: 7px; overflow:hidden;
}
.stepper:focus-within{ border-color: var(--brass); }
.stepper-btn{
  flex: 0 0 26px; background: var(--panel-hi); border: none; color: var(--text-dim); font-size: 14px;
  font-family: 'JetBrains Mono', monospace; cursor: pointer; line-height:1; display:flex; align-items:center; justify-content:center;
}
.stepper-btn:hover{ color: var(--brass-bright); }
.stepper-btn:active{ background: var(--panel); }
.stepper-btn:disabled{ opacity: 0.35; cursor:default; color: var(--text-dim); }
.stepper-value{
  flex: 1 1 auto; width: 0; min-width:0; background:none; border:none; color: var(--text); font-size: 12.5px;
  text-align:center; outline:none; font-family: inherit; padding: 7px 2px;
  /* hide native number spinner in browsers that still add one */
  -moz-appearance: textfield;
}
.stepper-value::-webkit-outer-spin-button, .stepper-value::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.roster-total{ font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-mute); margin: 8px 0 14px; }
.roster-total strong{ color: var(--brass-bright); }

.room-columns{ display:grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items:start; }
@media (max-width: 700px){ .room-columns{ grid-template-columns: 1fr; } }

.join-code-row{ display:flex; gap: 8px; margin-top: 4px; }
.join-code-row input{
  flex: 1 1 auto; background: var(--panel-alt); border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 11px; color: var(--text); font-size: 13px; outline:none;
}

.section-label{
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-mute); margin: 22px 0 10px;
}
.section-label:first-child{ margin-top: 0; }

.room-list{ display:flex; flex-direction:column; gap: 8px; }
.room-card{
  display:flex; align-items:center; gap: 14px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
}
.room-name{ font-family: 'Fraunces', serif; font-weight: 700; font-size: 14.5px; color: var(--text); }
.room-meta{ font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-mute); margin-top: 3px; }
.room-status-pill{
  font-family: 'JetBrains Mono', monospace; font-size: 9.5px; text-transform: uppercase; letter-spacing:.04em;
  padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border-soft); color: var(--text-mute); flex-shrink:0;
}
.room-status-pill.waiting{ color: var(--brass-bright); border-color: var(--brass-dim); }
.room-status-pill.in_progress{ color: #7a9e4e; border-color: #7a9e4e; }
.room-status-pill.completed{ color: var(--text-mute); }
.room-join-btn{
  margin-left:auto; flex-shrink:0; background: var(--brass); border: 1px solid var(--brass); color: #241209;
  font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 16px; border-radius: 8px; cursor:pointer;
}
.room-join-btn:hover{ filter: brightness(1.08); }
.room-join-btn:disabled{ opacity: 0.5; cursor:default; }
.room-join-btn.secondary{ background: var(--panel-alt); border-color: var(--border); color: var(--text-dim); font-weight:500; }

.empty-state{ padding: 30px 20px; text-align:center; color: var(--text-mute); font-size: 13px; }
.md-status{ font-size: 12.5px; color: var(--text-mute); margin-top: 12px; min-height:16px; }
.md-status.error{ color: var(--danger); }
.gate-note{ font-size: 12.5px; color: var(--text-mute); text-align:center; padding: 12px; }

/* ---------- Results modal ----------
   Duplicated (not shared) board/roster rendering, same convention as
   mock-draft-live.html -- see CLAUDE.md's "no shared component system"
   note. Board/roster class names match mock-draft-live.html verbatim. */
.modal-box.results-modal-box{ max-width: min(94vw, 1000px); max-height: 88vh; overflow-y: auto; text-align:left; }
.results-layout{ display:grid; grid-template-columns: 1fr 300px; gap: 16px; align-items:start; }
@media (max-width: 760px){ .results-layout{ grid-template-columns: 1fr; } }
.results-panel{ background: var(--panel-alt); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.results-panel h3{ font-family: 'Fraunces', serif; font-weight: 700; font-size: 14px; color: var(--text); margin: 0 0 10px; }
.results-team-head{ display:flex; align-items:center; justify-content:space-between; gap: 8px; margin-bottom: 10px; }
.results-team-head h3{ margin:0; }

.board-wrap{ max-height: 50vh; overflow-y:auto; overflow-x:hidden; border: 1px solid var(--border-soft); border-radius: 8px; background: #17100e; padding: 2px; }
table.board-table{ table-layout: fixed; border-collapse: separate; border-spacing: 3px; width: 100%; }
table.board-table th{
  position: sticky; top:0; background: #2a1c17; text-align:left; padding: 6px 5px; font-size: 9px;
  font-family: 'JetBrains Mono', monospace; color: var(--text-mute); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; border-radius: 5px; z-index: 2;
}
th.team-header{ cursor:pointer; transition: color .12s ease; }
th.team-header:hover{ color: var(--brass-bright); }
th.rd-col, td.rd-col{
  width: 30px; text-align:center; background: #100b09; color: var(--text-mute); font-family:'JetBrains Mono', monospace;
  font-size: 10.5px; font-weight:700; border-radius: 5px;
}
table.board-table td{
  padding: 4px 5px; font-size: 10px; color: var(--text-dim); vertical-align: top; background: var(--panel-alt);
  border-radius: 5px; overflow:hidden; border-left: 3px solid transparent;
}
table.board-table td.board-cell{ height: 48px; }
.bc-pick{ font-family:'JetBrains Mono', monospace; font-size: 8.5px; color: var(--text-mute); margin-bottom: 2px; }
.bc-name{ font-weight:700; color: var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size: 10.5px; }
.bc-meta{ font-family:'JetBrains Mono', monospace; font-size: 8px; color: var(--text-mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top: 1px; }
table.board-table td.has-player{ cursor:pointer; }
table.board-table td.has-player:hover{ outline: 1px solid var(--brass-dim); outline-offset: -1px; }
table.board-table td.empty-cell{ opacity: 0.55; }
table.board-table td.mine-col{ outline: 1px solid rgba(201,161,90,0.4); outline-offset: -1px; }
table.board-table th.mine-col{ color: var(--brass-bright); }

.team-switch-select{
  background: var(--panel-hi); border: 1px solid var(--border); border-radius: 7px; color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 5px 7px; max-width: 160px; cursor:pointer; outline:none;
}
.team-switch-select.own-team{ border-color: var(--brass); color: var(--brass-bright); background: rgba(201,161,90,0.1); }

.roster-slot-list{ display:flex; flex-direction:column; gap: 6px; }
.roster-slot{
  display:flex; align-items:center; gap: 7px; background: var(--panel-hi); border: 1px solid var(--border-soft);
  border-radius: 8px; padding: 6px 9px; min-height: 34px;
}
.roster-slot.filled{ border-color: var(--border); cursor:pointer; }
.roster-slot.filled:hover{ border-color: var(--brass-dim); }
.roster-slot-type{
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight:700; color: var(--text-mute);
  background: var(--panel); border-radius: 5px; padding: 2px 5px; flex-shrink:0; width: 32px; text-align:center;
}
.roster-slot .avatar-wrap{ width: 24px; height: 24px; flex-shrink:0; }
.roster-slot-player{ font-size: 12px; color: var(--text); flex: 1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.roster-slot-empty{ font-size: 11.5px; color: var(--text-mute); font-style:italic; }
.roster-slot-bye{ font-family:'JetBrains Mono', monospace; font-size: 9px; color: var(--text-mute); flex-shrink:0; margin-left: 2px; }
.roster-bench-label{ margin: 10px 0 4px; font-family:'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing:.06em; text-transform:uppercase; color: var(--text-mute); }

.rh-btn{
  background: var(--panel-hi); border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  font-family: 'JetBrains Mono', monospace; padding: 8px 14px; border-radius: 8px; cursor:pointer; white-space:nowrap;
}
.rh-btn:hover{ border-color: var(--brass-dim); color: var(--text); }
.rh-btn.primary{ background: var(--brass); border-color: var(--brass); color: #241209; font-weight: 700; }

.subscriber-toggle{ display:flex; align-items:center; gap: 6px; font-size: 11.5px; color: var(--text-dim); white-space:nowrap; padding-bottom: 7px; }
.subscriber-toggle input{ accent-color: var(--brass); width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <div class="topbar"><div id="authBox"></div></div>
    <div class="wrap">

      <div class="page-head">
        <h1>Mock Draft</h1>
        <p>Practice draft day against real people, bots, or both — as many rooms as people want to run at once.</p>
      </div>

      <div class="md-layout">
        <div>
          <div class="panel" id="createPanel">
            <h2>Start a Room</h2>
            <div id="createGate" class="gate-note" style="display:none">Log in to host a mock draft.</div>
            <div id="createForm">
              <div class="md-row">
                <div class="modal-field">
                  <label>Teams</label>
                  <select id="fTeamCount"></select>
                </div>
                <div class="modal-field">
                  <label>Pick Timer</label>
                  <select id="fPickSeconds">
                    <option value="30">30 sec</option>
                    <option value="45">45 sec</option>
                    <option value="60" selected>60 sec</option>
                    <option value="90">90 sec</option>
                    <option value="120">2 min</option>
                  </select>
                </div>
              </div>
              <div class="md-row">
                <div class="modal-field">
                  <label>Pick Order</label>
                  <select id="fDraftType">
                    <option value="snake" selected>Snake</option>
                    <option value="linear">Linear</option>
                  </select>
                </div>
                <div class="modal-field">
                  <label>Draft Format</label>
                  <select id="fScoringFormat">
                    <option value="ppr" selected>PPR</option>
                    <option value="half_ppr">Half-PPR</option>
                    <option value="tep">TE Premium</option>
                    <option value="superflex">Superflex</option>
                  </select>
                </div>
              </div>

              <div class="modal-field"><label>Roster Construction</label></div>
              <div class="roster-grid" style="margin-top:6px">
                <div class="roster-field"><label>QB</label><div class="stepper" data-min="0" data-max="4">
                  <button type="button" class="stepper-btn" data-step="-1" aria-label="Decrease">&minus;</button>
                  <input class="stepper-value" id="rQb" value="1" inputmode="numeric">
                  <button type="button" class="stepper-btn" data-step="1" aria-label="Increase">&plus;</button>
                </div></div>
                <div class="roster-field"><label>RB</label><div class="stepper" data-min="0" data-max="6">
                  <button type="button" class="stepper-btn" data-step="-1" aria-label="Decrease">&minus;</button>
                  <input class="stepper-value" id="rRb" value="2" inputmode="numeric">
                  <button type="button" class="stepper-btn" data-step="1" aria-label="Increase">&plus;</button>
                </div></div>
                <div class="roster-field"><label>WR</label><div class="stepper" data-min="0" data-max="6">
                  <button type="button" class="stepper-btn" data-step="-1" aria-label="Decrease">&minus;</button>
                  <input class="stepper-value" id="rWr" value="2" inputmode="numeric">
                  <button type="button" class="stepper-btn" data-step="1" aria-label="Increase">&plus;</button>
                </div></div>
                <div class="roster-field"><label>TE</label><div class="stepper" data-min="0" data-max="4">
                  <button type="button" class="stepper-btn" data-step="-1" aria-label="Decrease">&minus;</button>
                  <input class="stepper-value" id="rTe" value="1" inputmode="numeric">
                  <button type="button" class="stepper-btn" data-step="1" aria-label="Increase">&plus;</button>
                </div></div>
                <div class="roster-field"><label>FLEX</label><div class="stepper" data-min="0" data-max="4">
                  <button type="button" class="stepper-btn" data-step="-1" aria-label="Decrease">&minus;</button>
                  <input class="stepper-value" id="rFlex" value="1" inputmode="numeric">
                  <button type="button" class="stepper-btn" data-step="1" aria-label="Increase">&plus;</button>
                </div></div>
                <div class="roster-field"><label>D/ST</label><div class="stepper" data-min="0" data-max="2">
                  <button type="button" class="stepper-btn" data-step="-1" aria-label="Decrease">&minus;</button>
                  <input class="stepper-value" id="rDst" value="1" inputmode="numeric">
                  <button type="button" class="stepper-btn" data-step="1" aria-label="Increase">&plus;</button>
                </div></div>
                <div class="roster-field"><label>K</label><div class="stepper" data-min="0" data-max="2">
                  <button type="button" class="stepper-btn" data-step="-1" aria-label="Decrease">&minus;</button>
                  <input class="stepper-value" id="rK" value="1" inputmode="numeric">
                  <button type="button" class="stepper-btn" data-step="1" aria-label="Increase">&plus;</button>
                </div></div>
                <div class="roster-field"><label>Bench</label><div class="stepper" data-min="0" data-max="12">
                  <button type="button" class="stepper-btn" data-step="-1" aria-label="Decrease">&minus;</button>
                  <input class="stepper-value" id="rBench" value="6" inputmode="numeric">
                  <button type="button" class="stepper-btn" data-step="1" aria-label="Increase">&plus;</button>
                </div></div>
              </div>
              <div class="roster-total">Total roster size: <strong id="rosterTotal">15</strong> rounds</div>

              <label class="subscriber-toggle" style="margin-bottom:14px">
                <input type="checkbox" id="fIsPublic">
                List in the public lobby
              </label>
              <button class="modal-submit" id="createBtn">Create Room</button>
              <div class="md-status" id="createStatus"></div>
            </div>
          </div>

          <div class="panel" style="margin-top:16px">
            <h2>Join by Code</h2>
            <div class="join-code-row">
              <input type="text" id="joinCodeInput" placeholder="Invite code">
              <button class="room-join-btn" id="joinCodeBtn">Join</button>
            </div>
            <div class="md-status" id="joinStatus"></div>
          </div>
        </div>

        <div class="room-columns">
          <div>
            <div class="section-label">Public Rooms</div>
            <div class="room-list" id="publicRoomsList"></div>
          </div>
          <div>
            <div class="section-label" id="myRoomsLabel" style="display:none">Your Rooms</div>
            <div class="room-list" id="myRoomsList"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal-backdrop" id="resultsModal">
  <div class="modal-box results-modal-box">
    <button class="modal-close" id="resultsModalClose" aria-label="Close">&times;</button>
    <h2 class="modal-title" id="resultsModalTitle" style="text-align:left">Results</h2>
    <div id="resultsModalBody">
      <div class="empty-state">Loading results&hellip;</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/players-data.js"></script>
<script src="js/player-render.js"></script>
<script src="js/player-detail.js"></script>
<script src="js/sidebar.js"></script>
<script>
(function(){
  var els = {
    createGate: document.getElementById('createGate'),
    createForm: document.getElementById('createForm'),
    fTeamCount: document.getElementById('fTeamCount'),
    fPickSeconds: document.getElementById('fPickSeconds'),
    fDraftType: document.getElementById('fDraftType'),
    fScoringFormat: document.getElementById('fScoringFormat'),
    fIsPublic: document.getElementById('fIsPublic'),
    rQb: document.getElementById('rQb'),
    rRb: document.getElementById('rRb'),
    rWr: document.getElementById('rWr'),
    rTe: document.getElementById('rTe'),
    rFlex: document.getElementById('rFlex'),
    rDst: document.getElementById('rDst'),
    rK: document.getElementById('rK'),
    rBench: document.getElementById('rBench'),
    rosterTotal: document.getElementById('rosterTotal'),
    createBtn: document.getElementById('createBtn'),
    createStatus: document.getElementById('createStatus'),
    joinCodeInput: document.getElementById('joinCodeInput'),
    joinCodeBtn: document.getElementById('joinCodeBtn'),
    joinStatus: document.getElementById('joinStatus'),
    myRoomsLabel: document.getElementById('myRoomsLabel'),
    myRoomsList: document.getElementById('myRoomsList'),
    publicRoomsList: document.getElementById('publicRoomsList')
  };

  [6, 8, 10, 12, 14, 16].forEach(function(t){
    var opt = document.createElement('option');
    opt.value = t; opt.textContent = t + ' teams';
    if (t === 10) opt.selected = true;
    els.fTeamCount.appendChild(opt);
  });

  var SCORING_LABELS = { ppr: 'PPR', half_ppr: 'Half-PPR', tep: 'TE Premium', superflex: 'Superflex' };

  function rosterInputs(){
    return [els.rQb, els.rRb, els.rWr, els.rTe, els.rFlex, els.rDst, els.rK, els.rBench];
  }
  function updateRosterTotal(){
    var total = rosterInputs().reduce(function(sum, el){ return sum + (parseInt(el.value, 10) || 0); }, 0);
    els.rosterTotal.textContent = total;
  }
  rosterInputs().forEach(function(el){ el.addEventListener('input', updateRosterTotal); });
  updateRosterTotal();

  // ---- Custom stepper (replaces native <input type=number> arrows) ----
  document.querySelectorAll('.stepper').forEach(function(stepper){
    var input = stepper.querySelector('.stepper-value');
    var min = parseInt(stepper.getAttribute('data-min'), 10);
    var max = parseInt(stepper.getAttribute('data-max'), 10);
    function clamp(v){ return Math.max(min, Math.min(max, isNaN(v) ? min : v)); }
    function setValue(v){
      input.value = clamp(v);
      updateRosterTotal();
    }
    stepper.querySelectorAll('.stepper-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        setValue((parseInt(input.value, 10) || 0) + parseInt(btn.getAttribute('data-step'), 10));
      });
    });
    input.addEventListener('input', function(){
      input.value = input.value.replace(/[^0-9]/g, '');
    });
    input.addEventListener('blur', function(){ setValue(parseInt(input.value, 10)); });
  });

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // A room whose pick_deadline sits long in the past just means
  // nobody's browser has had it open to drive autopick forward --
  // there's no server-side cron (see the Mock Drafts comment in
  // schema.sql). It's still "Live"; it advances again the moment
  // someone reopens it, same as any other client-driven feature here.
  function fmtStatus(room){
    if (room.status === 'completed') return 'Finished';
    if (room.status === 'waiting') return 'Open';
    return 'Live';
  }

  function roomCard(room, slotCounts, isMine){
    var card = document.createElement('div');
    card.className = 'room-card';
    var counts = slotCounts[room.id] || { filled: 0, total: room.team_count };
    card.innerHTML =
      '<div>' +
        '<div class="room-name">' + escapeHtml(room.name) + '</div>' +
        '<div class="room-meta">' + room.team_count + '-team · ' + room.rounds + ' rd · ' + room.draft_type +
          ' · ' + (SCORING_LABELS[room.scoring_format] || 'PPR') + ' · ' + counts.filled + '/' + counts.total + ' filled</div>' +
      '</div>' +
      '<span class="room-status-pill ' + room.status + '">' + fmtStatus(room) + '</span>';

    var btn = document.createElement('button');
    btn.className = 'room-join-btn' + (isMine ? ' secondary' : '');
    if (room.status === 'completed'){
      btn.textContent = 'View Results';
      btn.addEventListener('click', function(){ openResultsModal(room.id); });
    } else if (room.status === 'in_progress'){
      // Skips the waiting room entirely -- opened directly from this
      // click so the new tab isn't blocked by the popup blocker.
      btn.textContent = 'Watch/Play';
      btn.addEventListener('click', function(){ window.open('mock-draft-live.html?room=' + room.id, '_blank'); });
    } else if (isMine){
      btn.textContent = 'Open Room';
      btn.addEventListener('click', function(){ window.location.href = 'mock-draft-room.html?room=' + room.id; });
    } else {
      btn.textContent = counts.filled >= counts.total ? 'Full' : 'Join';
      btn.disabled = counts.filled >= counts.total;
      btn.addEventListener('click', function(){ joinRoom(room.id, room.invite_code); });
    }
    card.appendChild(btn);
    return card;
  }

  function loadSlotCounts(roomIds){
    if (!roomIds.length) return Promise.resolve({});
    return window.sb.from('mock_draft_slots').select('room_id,user_id,is_bot').in('room_id', roomIds).then(function(res){
      var counts = {};
      (res.data || []).forEach(function(s){
        if (!counts[s.room_id]) counts[s.room_id] = { filled: 0, total: 0 };
        counts[s.room_id].total++;
        if (s.user_id || s.is_bot) counts[s.room_id].filled++;
      });
      return counts;
    });
  }

  function loadRooms(){
    var uid = window.Auth && window.Auth.user ? window.Auth.user.id : null;

    var publicQuery = window.sb.from('mock_draft_rooms').select('*').eq('is_public', true)
      .neq('status', 'completed').order('created_at', { ascending: false }).limit(20);

    var minePromise = uid
      ? window.sb.from('mock_draft_slots').select('room_id').eq('user_id', uid).then(function(res){
          var ids = Array.from(new Set((res.data || []).map(function(r){ return r.room_id; })));
          if (!ids.length) return [];
          return window.sb.from('mock_draft_rooms').select('*').in('id', ids).order('created_at', { ascending: false }).then(function(r){ return r.data || []; });
        })
      : Promise.resolve([]);

    Promise.all([publicQuery, minePromise]).then(function(results){
      var publicRooms = results[0].data || [];
      var myRooms = results[1] || [];
      var allIds = Array.from(new Set(publicRooms.concat(myRooms).map(function(r){ return r.id; })));

      loadSlotCounts(allIds).then(function(counts){
        els.publicRoomsList.innerHTML = '';
        var joinablePublic = publicRooms.filter(function(r){ return !myRooms.some(function(m){ return m.id === r.id; }); });
        if (!joinablePublic.length){
          var empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = 'No public rooms open right now — start one!';
          els.publicRoomsList.appendChild(empty);
        } else {
          joinablePublic.forEach(function(r){ els.publicRoomsList.appendChild(roomCard(r, counts, false)); });
        }

        els.myRoomsLabel.style.display = '';
        els.myRoomsList.innerHTML = '';
        if (myRooms.length){
          myRooms.forEach(function(r){ els.myRoomsList.appendChild(roomCard(r, counts, true)); });
        } else {
          var emptyMine = document.createElement('div');
          emptyMine.className = 'empty-state';
          emptyMine.textContent = uid ? "You're not in any rooms yet." : 'Log in to see rooms you have joined or hosted.';
          els.myRoomsList.appendChild(emptyMine);
        }
      });
    });
  }

  function joinRoom(roomId, inviteCode){
    if (!window.Auth || !window.Auth.user){ window.Auth.openLogin(); return; }
    window.sb.rpc('join_mock_draft_room', { p_room_id: roomId, p_invite_code: inviteCode }).then(function(res){
      if (res.error){ els.joinStatus.textContent = res.error.message; els.joinStatus.classList.add('error'); return; }
      window.location.href = 'mock-draft-room.html?room=' + roomId;
    });
  }

  els.createBtn.addEventListener('click', function(){
    if (!window.Auth || !window.Auth.user){ window.Auth.openLogin(); return; }
    els.createStatus.textContent = '';
    els.createStatus.classList.remove('error');
    els.createBtn.disabled = true;
    els.createBtn.textContent = 'Creating…';
    window.sb.rpc('create_mock_draft_room', {
      p_name: '',
      p_team_count: parseInt(els.fTeamCount.value, 10),
      p_pick_seconds: parseInt(els.fPickSeconds.value, 10),
      p_draft_type: els.fDraftType.value,
      p_is_public: els.fIsPublic.checked,
      p_scoring_format: els.fScoringFormat.value,
      p_roster_qb: parseInt(els.rQb.value, 10) || 0,
      p_roster_rb: parseInt(els.rRb.value, 10) || 0,
      p_roster_wr: parseInt(els.rWr.value, 10) || 0,
      p_roster_te: parseInt(els.rTe.value, 10) || 0,
      p_roster_flex: parseInt(els.rFlex.value, 10) || 0,
      p_roster_dst: parseInt(els.rDst.value, 10) || 0,
      p_roster_k: parseInt(els.rK.value, 10) || 0,
      p_roster_bench: parseInt(els.rBench.value, 10) || 0
    }).then(function(res){
      els.createBtn.disabled = false;
      els.createBtn.textContent = 'Create Room';
      if (res.error){ els.createStatus.textContent = res.error.message; els.createStatus.classList.add('error'); return; }
      window.location.href = 'mock-draft-room.html?room=' + res.data;
    });
  });

  els.joinCodeBtn.addEventListener('click', function(){
    if (!window.Auth || !window.Auth.user){ window.Auth.openLogin(); return; }
    var code = els.joinCodeInput.value.trim();
    if (!code){ return; }
    els.joinStatus.textContent = '';
    els.joinStatus.classList.remove('error');
    window.sb.from('mock_draft_rooms').select('id,invite_code').eq('invite_code', code).maybeSingle().then(function(res){
      if (!res.data){ els.joinStatus.textContent = "No room found with that code."; els.joinStatus.classList.add('error'); return; }
      joinRoom(res.data.id, res.data.invite_code);
    });
  });

  function applyGate(){
    var loggedIn = !!(window.Auth && window.Auth.user);
    els.createGate.style.display = loggedIn ? 'none' : '';
    els.createForm.style.display = loggedIn ? '' : 'none';
    loadRooms();
  }

  var channel = window.sb.channel('mock-draft-lobby')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'mock_draft_rooms' }, loadRooms)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'mock_draft_slots' }, loadRooms)
    .subscribe();
  window.addEventListener('beforeunload', function(){ window.sb.removeChannel(channel); });

  window.addEventListener('auth:change', applyGate);
  if (window.Auth){ window.Auth.ready.then(applyGate); } else { loadRooms(); }

  // ---------------- Results modal ----------------
  // Board/roster rendering here is duplicated from mock-draft-live.html
  // (page-local, not a shared js/*.js module -- see CLAUDE.md's "no
  // shared component system" note), trimmed to the completed-draft case
  // only (no on-the-clock highlighting, no player pool/queue).
  var rEls = {
    modal: document.getElementById('resultsModal'),
    close: document.getElementById('resultsModalClose'),
    title: document.getElementById('resultsModalTitle'),
    body: document.getElementById('resultsModalBody')
  };
  var resultsRoom = null, resultsSlots = [], resultsPicks = [];
  var resultsSelectedSlot = null;
  var resultsPhotoObserver = window.PlayerRender ? window.PlayerRender.createPhotoObserver() : null;

  var ROSTER_POS_ORDER = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'DST', 'K'];
  var FLEX_ELIGIBLE = { RB: true, WR: true, TE: true };

  function playerByKey(key){ return window.__PLAYERS__.find(function(p){ return window.playerKey(p) === key; }) || null; }
  function openCardByKey(key){ var p = playerByKey(key); if (p && window.PlayerDetail) window.PlayerDetail.open(p); }
  function hexToRgba(hex, alpha){
    var h = String(hex || '').replace('#', '');
    if (h.length === 3) h = h.split('').map(function(c){ return c + c; }).join('');
    if (h.length !== 6) return 'rgba(136,136,136,' + alpha + ')';
    var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }
  function resultsPickLabelFromPick(pick){
    return pick.round + '.' + String(((pick.pick_number - 1) % resultsRoom.team_count) + 1).padStart(2, '0');
  }
  function resultsPickLabelForCell(round, slotIndex){
    var posInRound = (resultsRoom.draft_type === 'snake' && round % 2 === 0) ? (resultsRoom.team_count - slotIndex + 1) : slotIndex;
    return round + '.' + String(posInRound).padStart(2, '0');
  }

  function resultsRosterConfig(){
    return {
      QB: resultsRoom.roster_qb, RB: resultsRoom.roster_rb, WR: resultsRoom.roster_wr, TE: resultsRoom.roster_te,
      FLEX: resultsRoom.roster_flex, DST: resultsRoom.roster_dst, K: resultsRoom.roster_k, BENCH: resultsRoom.roster_bench
    };
  }
  function assignResultsRoster(slotIndex){
    var cfg = resultsRosterConfig();
    var mine = resultsPicks.filter(function(p){ return p.slot_index === slotIndex; }).slice().sort(function(a, b){ return a.pick_number - b.pick_number; });
    var slotsOut = [];
    ROSTER_POS_ORDER.forEach(function(pos){
      for (var i = 0; i < cfg[pos]; i++) slotsOut.push({ pos: pos, player: null });
    });
    var bench = [];
    mine.forEach(function(pick){
      var playerObj = window.__PLAYERS__.find(function(pl){ return window.playerKey(pl) === pick.player_key; });
      var pos = playerObj ? playerObj.pos : null;
      var target = slotsOut.find(function(s){ return !s.player && s.pos === pos; });
      if (!target && pos && FLEX_ELIGIBLE[pos]){
        target = slotsOut.find(function(s){ return !s.player && s.pos === 'FLEX'; });
      }
      if (target){ target.player = pick; } else { bench.push(pick); }
    });
    return { starters: slotsOut, bench: bench, benchSize: cfg.BENCH };
  }
  function resultsRosterSlotHtml(slotTypeLabel, pickRow){
    if (!pickRow){
      return '<div class="roster-slot"><span class="roster-slot-type">' + slotTypeLabel + '</span><span class="roster-slot-empty">Empty</span></div>';
    }
    var pl = playerByKey(pickRow.player_key);
    var pos = pl ? pl.pos : null;
    var posLabel = pos === 'DST' ? 'D/ST' : (pos || '?');
    var isFlexOrBench = (slotTypeLabel === 'FLEX' || slotTypeLabel === 'BENCH');
    var matches = !isFlexOrBench && pos && slotTypeLabel === pos;
    var typeStyle = '';
    if (matches && window.PlayerRender){
      var c = window.PlayerRender.posColor(pos);
      typeStyle = ' style="background:' + hexToRgba(c, 0.22) + ';color:' + c + ';"';
    }
    return '<div class="roster-slot filled" data-open-key="' + escapeHtml(pickRow.player_key) + '">' +
      '<span class="roster-slot-type"' + typeStyle + '>' + slotTypeLabel + '</span>' +
      '<span class="roster-avatar-slot" data-key="' + escapeHtml(pickRow.player_key) + '"></span>' +
      '<span class="roster-slot-player">' + escapeHtml(pickRow.player_name) + '</span>' +
      (matches ? '' : (pos ? '<span class="pp-pos-pill pos-' + pos + '">' + posLabel + '</span>' : '')) +
      (isFlexOrBench && pl && pl.bye ? '<span class="roster-slot-bye">Bye ' + pl.bye + '</span>' : '') +
    '</div>';
  }
  function resultsRosterAssignmentHtml(slotIndex){
    var assignment = assignResultsRoster(slotIndex);
    var html = '<div class="roster-slot-list">';
    assignment.starters.forEach(function(s){ html += resultsRosterSlotHtml(s.pos, s.player); });
    html += '</div>';
    html += '<div class="roster-bench-label">Bench (' + assignment.bench.length + '/' + assignment.benchSize + ')</div>';
    html += '<div class="roster-slot-list">';
    for (var i = 0; i < assignment.benchSize; i++){
      html += resultsRosterSlotHtml('BENCH', assignment.bench[i] || null);
    }
    html += '</div>';
    return html;
  }
  function hydrateResultsRosterAvatars(container){
    container.querySelectorAll('.roster-avatar-slot').forEach(function(slotEl){
      var p = playerByKey(slotEl.getAttribute('data-key'));
      if (p && window.PlayerRender) slotEl.replaceWith(window.PlayerRender.buildAvatarWrap(p, resultsPhotoObserver));
    });
  }

  function renderResultsBoard(){
    var uid = window.Auth && window.Auth.user ? window.Auth.user.id : null;
    var boardMap = {};
    resultsPicks.forEach(function(p){ boardMap[p.round + '-' + p.slot_index] = p; });

    var html = '<table class="board-table"><thead><tr><th class="rd-col">Rd</th>';
    resultsSlots.forEach(function(s){
      html += '<th class="team-header' + (s.user_id === uid ? ' mine-col' : '') + '" data-team-slot="' + s.slot_index + '" title="' + escapeHtml(s.team_label) + '">' + escapeHtml(s.team_label) + '</th>';
    });
    html += '</tr></thead><tbody>';
    for (var r = 1; r <= resultsRoom.rounds; r++){
      html += '<tr><td class="rd-col">' + r + '</td>';
      resultsSlots.forEach(function(s){
        var pick = boardMap[r + '-' + s.slot_index];
        var pl = pick ? playerByKey(pick.player_key) : null;
        var pickLabel = pick ? resultsPickLabelFromPick(pick) : resultsPickLabelForCell(r, s.slot_index);
        var cls = 'board-cell' + (pick ? ' has-player' : ' empty-cell') + (s.user_id === uid ? ' mine-col' : '');
        var style = '';
        if (pl && window.PlayerRender){
          var c = window.PlayerRender.posColor(pl.pos);
          style = ' style="background:' + hexToRgba(c, 0.16) + ';border-left-color:' + c + ';"';
        }
        var dataAttr = pick ? ' data-player-key="' + escapeHtml(pick.player_key) + '"' : '';
        var titleAttr = pick ? ' title="' + escapeHtml(pick.player_name) + '"' : '';
        var plMeta = pl ? (pl.pos === 'DST' ? 'D/ST' : pl.pos) + (pl.bye ? ' &middot; Bye ' + pl.bye : '') : '';
        var body = '<div class="bc-pick">' + pickLabel + '</div>' +
          (pick ? '<div class="bc-name">' + escapeHtml(pick.player_name) + '</div><div class="bc-meta">' + plMeta + '</div>' : '');
        html += '<td class="' + cls + '"' + dataAttr + titleAttr + style + '>' + body + '</td>';
      });
      html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
  }

  function renderResultsTeamSelect(){
    var uid = window.Auth && window.Auth.user ? window.Auth.user.id : null;
    var mySlotObj = uid ? resultsSlots.find(function(s){ return s.user_id === uid; }) : null;
    var ordered = resultsSlots.slice().sort(function(a, b){ return a.slot_index - b.slot_index; });
    if (resultsSelectedSlot == null || !ordered.some(function(s){ return s.slot_index === resultsSelectedSlot; })){
      resultsSelectedSlot = mySlotObj ? mySlotObj.slot_index : (ordered[0] ? ordered[0].slot_index : null);
    }
    var sel = document.getElementById('resultsTeamSelect');
    if (!sel) return;
    var html = '';
    ordered.forEach(function(s){
      var label = (s.user_id === uid ? '★ You — ' : '') + s.team_label;
      html += '<option value="' + s.slot_index + '"' + (s.slot_index === resultsSelectedSlot ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
    });
    sel.innerHTML = html;
    sel.classList.toggle('own-team', !!(mySlotObj && resultsSelectedSlot === mySlotObj.slot_index));
  }
  function renderResultsTeamPanel(){
    var body = document.getElementById('resultsTeamBody');
    if (!body) return;
    if (resultsSelectedSlot == null){ body.innerHTML = '<div class="empty-state">No teams.</div>'; return; }
    body.innerHTML = resultsRosterAssignmentHtml(resultsSelectedSlot);
    hydrateResultsRosterAvatars(body);
  }

  function handleResultsDraftAgain(){
    if (!window.Auth || !window.Auth.user){ window.Auth.openLogin(); return; }
    // Strip any existing trailing "(rematch)" suffix first so a rematch
    // of a rematch doesn't double up the label -- same fix as
    // mock-draft-live.html's Draft Again.
    var baseName = resultsRoom.name.replace(/\s*\(rematch\)\s*$/i, '');
    window.sb.rpc('create_mock_draft_room', {
      p_name: baseName + ' (rematch)',
      p_team_count: resultsRoom.team_count, p_pick_seconds: resultsRoom.pick_seconds,
      p_draft_type: resultsRoom.draft_type, p_is_public: resultsRoom.is_public,
      p_scoring_format: resultsRoom.scoring_format,
      p_roster_qb: resultsRoom.roster_qb, p_roster_rb: resultsRoom.roster_rb, p_roster_wr: resultsRoom.roster_wr, p_roster_te: resultsRoom.roster_te,
      p_roster_flex: resultsRoom.roster_flex, p_roster_dst: resultsRoom.roster_dst, p_roster_k: resultsRoom.roster_k, p_roster_bench: resultsRoom.roster_bench
    }).then(function(res){
      if (res.error){ alert(res.error.message); return; }
      window.location.href = 'mock-draft-room.html?room=' + res.data;
    });
  }

  function renderResultsModalBody(){
    rEls.title.textContent = resultsRoom.name + ' — Results';
    rEls.body.innerHTML =
      '<div class="results-layout">' +
        '<div class="results-panel">' +
          '<h3>Draft Board</h3>' +
          '<div class="board-wrap">' + renderResultsBoard() + '</div>' +
        '</div>' +
        '<div class="results-panel">' +
          '<div class="results-team-head"><h3>Team</h3><select class="team-switch-select" id="resultsTeamSelect"></select></div>' +
          '<div id="resultsTeamBody"></div>' +
        '</div>' +
      '</div>' +
      '<button class="rh-btn primary" id="resultsDraftAgainBtn" style="margin-top:16px">Draft Again</button>';

    renderResultsTeamSelect();
    renderResultsTeamPanel();

    document.getElementById('resultsTeamSelect').addEventListener('change', function(e){
      resultsSelectedSlot = parseInt(e.target.value, 10);
      renderResultsTeamPanel();
    });
    document.getElementById('resultsDraftAgainBtn').addEventListener('click', handleResultsDraftAgain);
  }

  function openResultsModal(roomId){
    resultsSelectedSlot = null;
    rEls.title.textContent = 'Loading Results…';
    rEls.body.innerHTML = '<div class="empty-state">Loading results&hellip;</div>';
    rEls.modal.classList.add('open');

    Promise.all([
      window.sb.from('mock_draft_rooms').select('*').eq('id', roomId).maybeSingle(),
      window.sb.from('mock_draft_slots').select('*').eq('room_id', roomId).order('slot_index'),
      window.sb.from('mock_draft_picks').select('*').eq('room_id', roomId).order('pick_number')
    ]).then(function(results){
      if (!results[0].data){
        rEls.title.textContent = 'Not Found';
        rEls.body.innerHTML = '<div class="empty-state">This room no longer exists.</div>';
        return;
      }
      resultsRoom = results[0].data;
      resultsSlots = results[1].data || [];
      resultsPicks = results[2].data || [];
      renderResultsModalBody();
    });
  }

  rEls.close.addEventListener('click', function(){ rEls.modal.classList.remove('open'); });
  rEls.modal.addEventListener('click', function(e){ if (e.target === rEls.modal) rEls.modal.classList.remove('open'); });
  rEls.body.addEventListener('click', function(e){
    var td = e.target.closest('[data-player-key]');
    if (td){ openCardByKey(td.getAttribute('data-player-key')); return; }
    var th = e.target.closest('[data-team-slot]');
    if (th){ resultsSelectedSlot = parseInt(th.getAttribute('data-team-slot'), 10); renderResultsTeamSelect(); renderResultsTeamPanel(); return; }
    var openEl = e.target.closest('[data-open-key]');
    if (openEl) openCardByKey(openEl.getAttribute('data-open-key'));
  });

  // Redirect target from a stale mock-draft-room.html visit to a room
  // that's since completed (see CLAUDE.md's Mock Drafts section).
  var resultsParam = new URLSearchParams(window.location.search).get('results');
  if (resultsParam) openResultsModal(resultsParam);
})();
</script>
</body>
