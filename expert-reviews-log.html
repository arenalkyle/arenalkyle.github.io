<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Log &middot; The Board</title>
<link rel="stylesheet" href="css/theme.css">
<style>
.wrap{
  flex: 1 1 auto; min-height: 0; padding: 18px 24px 24px; max-width: 1100px; width: 100%; margin: 0 auto;
  display: flex; flex-direction: column; overflow-y: auto;
}
.page-head{ margin-bottom: 18px; }
.page-head h1{ font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; margin: 0 0 4px; color: var(--text); }
.page-head p{ font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-mute); margin: 0; }

.panel{ background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }

.admin-search{
  width: 100%; max-width: 320px; background: var(--panel-alt); border: 1px solid var(--border); border-radius: 7px;
  padding: 8px 10px; color: var(--text); font-size: 13px; outline:none; margin-bottom: 12px;
}

table.admin-table{ width: 100%; border-collapse: collapse; }
table.admin-table th{
  text-align: left; padding: 8px 10px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-mute); border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.admin-table td{ padding: 8px 10px; border-bottom: 1px solid var(--border-soft); font-size: 13px; color: var(--text-dim); vertical-align: middle; }
table.admin-table tr:hover td{ background: var(--panel-hi); }

.status-pill{
  font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 999px; display:inline-block;
}
.status-pill.submitted{ color: var(--danger); background: rgba(224,104,92,0.14); }
.status-pill.in_review{ color: var(--brass); background: rgba(201,161,90,0.14); }
.status-pill.completed{ color: #8fa66b; background: rgba(143,166,107,0.14); }

.view-btn{
  background: var(--panel-alt); border: 1px solid var(--border); color: var(--text); font-size: 12px;
  padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space:nowrap;
}
.view-btn:hover{ border-color: var(--brass-dim); }

.gate-block{ display:none; flex-direction: column; align-items:center; justify-content:center; gap: 12px; padding: 80px 20px; text-align:center; }
.gate-block.show{ display:flex; }
.gate-block p{ font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-mute); max-width: 360px; }
#logContent{ display:none; }
#logContent.show{ display:block; }

/* ---------- Detail modal ---------- */
.modal-box.review-modal{ max-width: 620px; max-height: 86vh; overflow-y: auto; text-align:left; }
.modal-box.review-modal .modal-title{ text-align:left; margin-bottom: 4px; }
.review-modal-sub{ font-size: 12px; color: var(--text-mute); margin-bottom: 16px; }
.detail-block{ margin-bottom: 14px; }
.detail-block label{
  display:block; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-mute); margin-bottom: 6px;
}
.detail-block .value{ font-size: 13.5px; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
.detail-block .value.empty{ color: var(--text-mute); font-style: italic; }
.modal-field textarea{
  width:100%; background: var(--panel-alt); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; color: var(--text); font-size: 13.5px; outline:none; resize: vertical; font-family: inherit;
}
.modal-field textarea:focus{ border-color: var(--brass); }
.modal-actions{ display:flex; align-items:center; justify-content:space-between; gap: 12px; margin-top: 18px; }
.modal-status{ font-size: 12px; color: var(--text-mute); }
.modal-status.error{ color: var(--danger); }
.checkout-btn{
  background: var(--brass); border: 1px solid var(--brass); color: #241209; font-weight: 700;
  font-family: 'JetBrains Mono', monospace; font-size: 12.5px; letter-spacing: 0.03em;
  padding: 10px 22px; border-radius: 8px; cursor: pointer; flex-shrink:0; transition: filter .12s ease;
}
.checkout-btn:hover{ filter: brightness(1.08); }
.checkout-btn:disabled{ opacity: 0.5; cursor: not-allowed; filter:none; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-area">
    <div class="topbar"><div id="authBox"></div></div>
    <div class="wrap">

      <div class="page-head">
        <h1>Review Log</h1>
        <p>Every expert review request, newest first.</p>
      </div>

      <div class="gate-block" id="gateBlock">
        <p>This page is only available to Admins and Experts.</p>
        <button class="login-btn" id="gateLoginBtn">Log In</button>
      </div>

      <div id="logContent">
        <div class="panel">
          <input type="text" class="admin-search" id="logSearch" placeholder="Search username or email&hellip;">
          <div style="overflow-x:auto">
            <table class="admin-table" id="logTable">
              <thead>
                <tr>
                  <th>User</th><th>Email</th><th>Type</th><th>Team</th><th>Status</th>
                  <th>Expert</th><th>Submitted</th><th></th>
                </tr>
              </thead>
              <tbody id="logTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal-backdrop" id="detailModal">
  <div class="modal-box review-modal" id="detailModalBox">
    <button class="modal-close" id="detailModalClose" aria-label="Close">&times;</button>
    <h2 class="modal-title" id="detailTitle"></h2>
    <div class="review-modal-sub" id="detailSub"></div>
    <div id="detailBody"></div>
    <div class="modal-field">
      <label>Response</label>
      <textarea id="detailResponse" rows="8"></textarea>
    </div>
    <div class="modal-actions">
      <span class="modal-status" id="detailStatus"></span>
      <button class="checkout-btn" id="detailSendBtn">Save &amp; Resend</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/players-data.js"></script>
<script>
(function(){
  var POS_LABELS = { QB:'QB', RB:'RB', WR:'WR', TE:'TE', FLEX:'FLEX', DST:'D/ST', K:'K' };
  var TYPE_LABELS = { team_review: 'Team Review', trade_analysis: 'Trade Analysis', start_sit: 'Start/Sit', personal_coach: 'Personal Coach' };

  var playersByKey = {};
  window.__PLAYERS__.forEach(function(p){ playersByKey[window.playerKey(p)] = p; });

  function playerLabel(key){
    var p = playersByKey[key];
    return p ? (p.name + ' · ' + p.team) : key;
  }

  var els = {
    gate: document.getElementById('gateBlock'),
    gateLoginBtn: document.getElementById('gateLoginBtn'),
    content: document.getElementById('logContent'),
    search: document.getElementById('logSearch'),
    tableBody: document.getElementById('logTableBody'),
    detailModal: document.getElementById('detailModal'),
    detailModalClose: document.getElementById('detailModalClose'),
    detailTitle: document.getElementById('detailTitle'),
    detailSub: document.getElementById('detailSub'),
    detailBody: document.getElementById('detailBody'),
    detailResponse: document.getElementById('detailResponse'),
    detailStatus: document.getElementById('detailStatus'),
    detailSendBtn: document.getElementById('detailSendBtn')
  };
  els.gateLoginBtn.addEventListener('click', function(){ window.Auth.openLogin(); });

  var rows = [];
  var searchTimer = null;

  function fmtDate(iso){
    if (!iso) return '—';
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  function detailField(label, value){
    var v = value ? String(value) : '';
    return '<div class="detail-block"><label>' + label + '</label><div class="value' + (v ? '' : ' empty') + '">' + (v || 'Not provided') + '</div></div>';
  }

  function buildDetailBody(row){
    var html = '';
    html += detailField('Team Name', row.team_name);
    if (row.review_type === 'team_review'){
      Object.keys(POS_LABELS).forEach(function(k){
        html += detailField(POS_LABELS[k], row.payload && row.payload[k]);
      });
    } else if (row.review_type === 'trade_analysis'){
      var sending = (row.payload && row.payload.sending) || [];
      var receiving = (row.payload && row.payload.receiving) || [];
      html += detailField('Sending', sending.map(playerLabel).join(', '));
      html += detailField('Receiving', receiving.map(playerLabel).join(', '));
    } else if (row.review_type === 'start_sit'){
      var players = (row.payload && row.payload.players) || [];
      html += detailField('Players', players.map(playerLabel).join(', '));
    } else if (row.review_type === 'personal_coach'){
      html += detailField('Tier', row.tier ? ('$' + row.tier) : '');
    }
    html += detailField('Notes', row.notes);
    return html;
  }

  var detailTarget = null;

  function openDetail(row){
    detailTarget = row;
    els.detailTitle.textContent = TYPE_LABELS[row.review_type] + ' — ' + row.username;
    els.detailSub.textContent = row.email + ' · $' + (row.price_cents / 100).toFixed(2) + ' · submitted ' + fmtDate(row.created_at) +
      (row.assigned_expert_username ? (' · handled by ' + row.assigned_expert_username) : '');
    els.detailBody.innerHTML = buildDetailBody(row);
    els.detailResponse.value = row.response || '';
    els.detailStatus.textContent = '';
    els.detailStatus.classList.remove('error');
    els.detailSendBtn.textContent = row.status === 'completed' ? 'Save & Resend' : 'Send';
    els.detailModal.classList.add('open');
  }

  els.detailModalClose.addEventListener('click', function(){ els.detailModal.classList.remove('open'); });
  els.detailModal.addEventListener('click', function(e){ if (e.target === els.detailModal) els.detailModal.classList.remove('open'); });

  els.detailSendBtn.addEventListener('click', function(){
    if (!detailTarget) return;
    var text = els.detailResponse.value.trim();
    if (!text){ els.detailStatus.textContent = 'Write a response first.'; els.detailStatus.classList.add('error'); return; }
    els.detailSendBtn.disabled = true;
    window.sb.rpc('admin_respond_expert_review', { p_request_id: detailTarget.id, p_response: text }).then(function(res){
      els.detailSendBtn.disabled = false;
      if (res.error){
        els.detailStatus.textContent = 'Could not send: ' + res.error.message;
        els.detailStatus.classList.add('error');
        return;
      }
      els.detailModal.classList.remove('open');
      loadRows(els.search.value.trim());
    });
  });

  function renderRows(){
    els.tableBody.innerHTML = '';
    rows.forEach(function(r){
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + r.username + '</td>' +
        '<td>' + r.email + '</td>' +
        '<td>' + TYPE_LABELS[r.review_type] + '</td>' +
        '<td>' + (r.team_name || '—') + '</td>' +
        '<td><span class="status-pill ' + r.status + '">' + r.status.replace('_', ' ') + '</span></td>' +
        '<td>' + (r.assigned_expert_username || '—') + '</td>' +
        '<td>' + fmtDate(r.created_at) + '</td>';
      var td = document.createElement('td');
      var btn = document.createElement('button');
      btn.className = 'view-btn';
      btn.textContent = r.status === 'completed' ? 'View / Resend' : 'Respond';
      btn.addEventListener('click', function(){ openDetail(r); });
      td.appendChild(btn);
      tr.appendChild(td);
      els.tableBody.appendChild(tr);
    });
  }

  function loadRows(search){
    window.sb.rpc('admin_list_expert_reviews', { search: search || null }).then(function(res){
      rows = res.data || [];
      renderRows();
    });
  }

  els.search.addEventListener('input', function(){
    clearTimeout(searchTimer);
    var q = els.search.value.trim();
    searchTimer = setTimeout(function(){ loadRows(q); }, 250);
  });

  function applyGate(){
    var allowed = window.Auth && window.Auth.can('manage_expert_reviews');
    els.gate.classList.toggle('show', !allowed);
    els.content.classList.toggle('show', !!allowed);
    if (allowed) loadRows('');
  }

  window.addEventListener('auth:change', applyGate);
  if (window.Auth){ window.Auth.ready.then(applyGate); }
})();
</script>
</body>
</html>
